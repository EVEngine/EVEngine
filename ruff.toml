# Ruff configuration for EVEngine Python code (scripts/ + tools/).
# Conservative initial rule set: syntax errors, undefined names, unused
# imports/variables (pyflakes) and a few pycodestyle checks. Tighten the rule
# set over time as the legacy codebase is cleaned up.
line-length = 100
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Test files intentionally patch sys.path before importing the package under
# test (module-import-not-at-top-of-file is by design there).
"scripts/tests/*.py" = ["E402"]
"tools/*/tests/*.py" = ["E402"]
"tools/*/test/*.py" = ["E402"]
