syntax = "proto3";

package eve.agent.proto;

// Version 2 is the first typed policy format. Version-1 Value/JSON documents
// remain importable through the script compatibility codec only.
message PolicyDocument {
  optional string schema = 1;
  optional uint32 version = 2;
  optional uint32 feature_count = 3;
  optional uint32 action_count = 4;
  optional uint32 hidden_width = 5;
  repeated double weights = 6;
}

enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  RUNNING = 1;
  SUCCESS = 2;
  FAILURE = 3;
}

message Observation {
  repeated float features = 1;
  repeated uint32 legal_actions = 2;
  repeated string coverage = 3;
  optional double reward = 4;
  optional Outcome outcome = 5;
  optional string finding = 6;
}

message TraceStep {
  optional uint32 action = 1;
  optional Observation observation = 2;
}

message TraceDocument {
  optional string schema = 1;
  optional uint32 version = 2;
  optional uint64 environment_seed = 3;
  optional double dt = 4;
  optional Observation initial = 5;
  repeated TraceStep steps = 6;
}
