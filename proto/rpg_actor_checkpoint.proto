syntax = "proto3";

package eve.rpg.proto;

message ActorAttributeSave {
  optional string id = 1;
  optional double value = 2;
}

message ActorProgressionSave {
  optional int32 level = 1;
  optional double xp = 2;
  optional double xp_to_next = 3;
}

message ActorTraitSave {
  optional string trait_id = 1;
  optional string source = 2;
}

message ActorClassSave {
  optional string id = 1;
  optional int32 skills_synced_up_to = 2;
}

message ActorCheckpointSave {
  optional string schema = 1;
  optional uint32 version = 2;
  repeated ActorAttributeSave base_attributes = 3;
  ActorProgressionSave progression = 4;
  map<string, double> vitals = 5;
  repeated string learned_skills = 6;
  repeated ActorTraitSave traits = 7;
  ActorClassSave class_info = 8 [json_name = "class"];
}
