name: Setup WebGPU browser
description: Install the pinned browser with current WebGPU resource-limit tiers
runs:
  using: composite
  steps:
    - name: Install Playwright and Chromium
      shell: bash
      run: |
        # Chromium before 146 exposes only the 16-texture tier, below the
        # engine's explicit 17-texture Mesh3D contract. Keep a current fixed browser.
        python3 -m pip install --quiet pillow playwright==1.64.1
        python3 -m playwright install --with-deps --no-shell chromium
