name: Apple SDK device acceptance

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published SDK tag containing the Apple consumer packaging tools
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apple-sdk-test-device
  cancel-in-progress: false

jobs:
  ios-device:
    # This runner must have a connected, trusted, unlocked test device with Developer Mode enabled.
    runs-on: [self-hosted, macOS, ARM64, ios-device]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require test-device configuration
        env:
          DEVICE_UDID: ${{ vars.IOS_TEST_DEVICE_UDID }}
          CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$DEVICE_UDID" && test -n "$CERTIFICATE" && test -n "$PROFILE" || {
            echo "ERROR: configure IOS_TEST_DEVICE_UDID and the iOS development signing secrets"
            exit 1
          }
      - name: Set up signing
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: bash .github/scripts/setup-ios-signing.sh
      - name: Download and verify published SDKs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apple-sdk-device"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/apple-sdk-device" \
            --pattern "eve-sdk-macosx-arm64-$TAG.zip" --pattern "eve-sdk-ios-$TAG.zip" --pattern SHA256SUMS
          cd "$RUNNER_TEMP/apple-sdk-device"
          grep -E 'eve-sdk-(macosx-arm64|ios)-' SHA256SUMS | shasum -a 256 --check --strict
          unzip -q "eve-sdk-macosx-arm64-$TAG.zip"
          unzip -q "eve-sdk-ios-$TAG.zip"
          chmod +x eve-sdk/macosx-arm64/bin/eve
      - name: Assemble, sign, install, launch and observe the SDK consumer game
        env:
          DEVICE_UDID: ${{ vars.IOS_TEST_DEVICE_UDID }}
        run: |
          python3 scripts/test_apple_sdk.py "$RUNNER_TEMP/apple-sdk-device/eve-sdk/macosx-arm64" \
            "$RUNNER_TEMP/apple-sdk-device/eve-sdk/ios" --platform ios --device "$DEVICE_UDID"
      - name: Remove ephemeral signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/evengine-ios-signing.keychain-db"
          if [ -f "$keychain" ]; then security delete-keychain "$keychain"; fi
