  android-release:
    name: Android (Release)
    needs: [debug-checks]
    runs-on: windows-latest
    # The release build step alone may take up to 90 minutes on a cold runner.
    # Leave room for toolchain setup and cache reporting at the job level.
    timeout-minutes: 180
    env:
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Install build tools
        timeout-minutes: 15
        shell: pwsh
        run: choco install make ninja -y --no-progress

      - name: Setup Java 17
        timeout-minutes: 10
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        timeout-minutes: 20
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_API }}
            build-tools;${{ env.ANDROID_API }}.0.0
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Resolve Android SDK / NDK paths
        timeout-minutes: 5
        run: bash .github/scripts/setup-android-sdk.sh

      - name: Write Gradle local.properties
        timeout-minutes: 5
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > platform/android/apk/local.properties
          test -f "$ANDROID_NDK/build/cmake/android.toolchain.cmake"

      - name: Identify third-party toolchain
        id: third-party-toolchain
        timeout-minutes: 5
        run: bash .github/scripts/identify-third-party-toolchain.sh android >> "$GITHUB_OUTPUT"

      - name: Restore verified third-party cache
        id: third-party-cache
        timeout-minutes: 20
        uses: ./.github/actions/restore-third-party
        with:
          platform: android
          configuration: Release
          toolchain: ${{ steps.third-party-toolchain.outputs.id }}

      - name: Build android release
        # Native compilation consumed 88 minutes before Gradle APK packaging.
        timeout-minutes: 120
        run: |
          test -f "$ANDROID_NDK/build/cmake/android.toolchain.cmake"
          make build/android \
            ANDROID_SDK="$ANDROID_SDK" \
            ANDROID_NDK="$ANDROID_NDK" \
            JAVA_HOME="$JAVA_HOME" \
            CMAKE_EXTRA_ARGS="-DEVENGINE_COMPILER_CACHE=OFF -DEVENGINE_ENABLE_ASSERTS=ON ${{ steps.third-party-cache.outputs.cmake-args }}" \
            ANDROID_JOBS="${NUMBER_OF_PROCESSORS:-8}"

      - name: Verify built third-party cache
        timeout-minutes: 5
        run: bash .github/scripts/verify-third-party-cache.sh "${{ steps.third-party-cache.outputs.prefix }}" android Release build/android/CMakeCache.txt

      - name: Save third-party cache
        if: >-
          steps.third-party-cache.outputs.cache-hit != 'true' &&
          (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' ||
           startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/v') || startsWith(inputs.ref, 'v'))
        timeout-minutes: 15
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.third-party-cache.outputs.path }}
          key: ${{ steps.third-party-cache.outputs.key }}

