            sudo tee /etc/apt/apt.conf.d/90eve-timeouts >/dev/null
          sudo pkill -f "unattended-upgrade" || true
          sudo systemctl stop apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          # Only Ubuntu indexes are needed for this toolchain.
          test -s /etc/apt/sources.list.d/ubuntu.sources
          apt_ok=0
          for i in 1 2 3; do
            timeout 120 sudo apt-get update -o Acquire::Retries=2 \
              -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
              -o Dir::Etc::sourceparts=- \
              -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 && { apt_ok=1; break; }
            [ "$i" -lt 3 ] && sleep 20
          done
          [ "$apt_ok" -eq 1 ] || exit 1
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libx11-dev libxxf86vm-dev libxi-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev libxext-dev libxss-dev \
            libgl1-mesa-dev \
            libbz2-dev libpng-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev \
            mesa-vulkan-drivers vulkan-tools \
            xvfb gcovr

      - name: Install Vulkan SDK
        timeout-minutes: 20
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1
        with:
          vulkan_version: ${{ env.VULKAN_VERSION }}
          cache: true
          cache_save_if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup software Vulkan ICD (Lavapipe)
        timeout-minutes: 5
        run: bash .github/scripts/setup-software-vulkan.sh

      - name: Identify third-party toolchain
        id: third-party-toolchain
        timeout-minutes: 5
        run: bash .github/scripts/identify-third-party-toolchain.sh linux >> "$GITHUB_OUTPUT"

      - name: Restore verified third-party cache
        id: third-party-cache
        timeout-minutes: 20
        uses: ./.github/actions/restore-third-party
        with:
          platform: linux
          configuration: Debug
          toolchain: ${{ steps.third-party-toolchain.outputs.id }}

      - name: Build linux debug (coverage)
        timeout-minutes: 75
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          make build/linux-coverage JOBS="$(nproc)"
          CMAKE_EXTRA_ARGS="-DEVENGINE_COMPILER_CACHE=OFF ${{ steps.third-party-cache.outputs.cmake-args }}"

      - name: Verify built third-party cache
        timeout-minutes: 5
        run: bash .github/scripts/verify-third-party-cache.sh "${{ steps.third-party-cache.outputs.prefix }}" linux Release build/linux-coverage/CMakeCache.txt

      - name: Save third-party cache
        if: >-
          steps.third-party-cache.outputs.cache-hit != 'true' &&
          (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' ||
           startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/v') || startsWith(inputs.ref, 'v'))
        timeout-minutes: 15
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.third-party-cache.outputs.path }}
          key: ${{ steps.third-party-cache.outputs.key }}

      - name: Run linux unit tests (coverage)
        timeout-minutes: 90
        env:
          ALSOFT_DRIVERS: "null"
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" make test/linux-coverage CTEST_JOBS="$(nproc)"

      - name: Generate coverage report
        timeout-minutes: 10
        run: |
          gcovr -r . --object-directory build/linux-coverage \
            --exclude 'build/' --exclude 'external/' --exclude 'third-party/' --exclude 'test/' \
            --gcov-ignore-parse-errors \
            --gcov-ignore-errors=no_working_dir_found \
            -x build/linux-coverage/coverage.xml
          gcovr -r . --object-directory build/linux-coverage \
            --exclude 'build/' --exclude 'external/' --exclude 'third-party/' --exclude 'test/' \
            --gcov-ignore-parse-errors \
            --gcov-ignore-errors=no_working_dir_found \
            --html --html-details -o build/linux-coverage/coverage.html

      - name: Upload coverage artifact
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: linux-coverage
          path: |
            build/linux-coverage/coverage.xml
            build/linux-coverage/coverage.html

