# Gate pull requests into main: documentation whitelist, or promote/vX.X.X
# from scripts/release.py finish. GITHUB_TOKEN-created PRs do not retrigger
# this workflow; finish posts the same check name (main-gate) via the Checks
# API so those PRs remain mergeable.

name: main-gate

on:
  pull_request:
    branches: [main]

permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  main-gate:
    name: main-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check main PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release.py check-main-pr
