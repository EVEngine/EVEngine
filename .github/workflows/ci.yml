# Continuous integration: daily Debug on the development branch (push/PR), plus a weekly run.
# Reusable via workflow_call (build_type: debug | release | both) for releases.
# Each platform runs as its own parallel job:
#   windows → win32 debug (+ unit tests); windows-release when asked
#   android → android debug; android-release when asked
#   macos   → macosx debug (+ unit tests); macos-release when asked
#   ios     → ios debug; ios-release when asked
#   linux   → linux debug (+ unit tests); linux-release when asked
#   webgpu  → webgpu (Emscripten/WASM) release
# Native Dawn: one independent Linux build with a surface/present smoke test.
#
# iOS signing (optional repo secrets):
#   IOS_CERTIFICATE_P12_BASE64, IOS_CERTIFICATE_PASSWORD, IOS_DEVELOPMENT_TEAM
#   IOS_PROVISIONING_PROFILE_BASE64 (optional)
# Without them, iOS builds unsigned (compile-only; cannot install to a device).

name: CI

on:
  workflow_call:
    inputs:
      build_type:
        description: debug | release | both
        type: string
        default: debug
      ref:
        description: git ref to check out (release branch or moved tag)
        type: string
        default: ""
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  schedule:
    # Weekly: Monday 00:00 CST ≈ Sunday 16:00 UTC
    - cron: "0 16 * * 0"
  workflow_dispatch:
    inputs:
      build_type:
        description: debug | release | both
        type: choice
        default: debug
        options: [debug, release, both]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Single source of truth: repository variables (Settings -> Secrets and
  # variables -> Actions -> Variables), falling back to these defaults.
  VULKAN_VERSION: ${{ vars.VULKAN_VERSION || '1.4.304.1' }}
  # Aligned to the NDK preinstalled on the windows-latest / macos-latest runner
  # images (27.3.13750724), so setup-android downloads nothing extra.
  ANDROID_NDK_VERSION: ${{ vars.ANDROID_NDK_VERSION || '27.3.13750724' }}
  ANDROID_API: ${{ vars.ANDROID_API || '34' }}

jobs:
  change-scope:
    name: Classify CI change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      windows: ${{ steps.scope.outputs.windows }}
      android: ${{ steps.scope.outputs.android }}
      macos: ${{ steps.scope.outputs.macos }}
      ios: ${{ steps.scope.outputs.ios }}
      linux: ${{ steps.scope.outputs.linux }}
      asan: ${{ steps.scope.outputs.asan }}
      fuzz: ${{ steps.scope.outputs.fuzz }}
      webgpu: ${{ steps.scope.outputs.webgpu }}
      dawn: ${{ steps.scope.outputs.dawn }}
      tools: ${{ steps.scope.outputs.tools }}
      test_mode: ${{ steps.scope.outputs.test_mode }}
      test_label_regex: ${{ steps.scope.outputs.test_label_regex }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Classify changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python3 scripts/ci_change_scope.py \
              --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && \
               [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python3 scripts/ci_change_scope.py \
              --base "$BEFORE_SHA" --head "$HEAD_SHA" --diff-mode direct \
              --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/ci_change_scope.py --all --github-output "$GITHUB_OUTPUT"
          fi

  # Fast source-only gate. Local equivalent: `make check` (scripts/check_source_quality.sh).
  source-quality:
    name: Source quality
    runs-on: ubuntu-24.04
    # The gate step below is the long pole (~15 min measured); the job budget has to stay
    # above the sum of the steps (checkout + tool install + gate + graph report).
    timeout-minutes: 35
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Install source-quality tools
        run: |
          # This job needs Ubuntu packages only. Leave the runner's Chrome
          # installation and repository configuration intact for browser jobs.
          apt_empty_parts="$(mktemp -d)"
          chmod 755 "$apt_empty_parts"
          trap 'rmdir "$apt_empty_parts"' EXIT
          apt_sources=(
            -o "Dir::Etc::sourcelist=$GITHUB_WORKSPACE/.github/apt/ubuntu-noble.sources"
            -o "Dir::Etc::sourceparts=$apt_empty_parts"
          )
          sudo apt-get "${apt_sources[@]}" update
          sudo apt-get "${apt_sources[@]}" install -y clang-format-18
          sudo ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format
          python3 -m pip install --user --quiet numpy pillow ruff

      - name: Run source-quality gate
        # Same entry point as local `make check`. Groups inside
        # scripts/check_source_quality.sh show up in the job log.
        # Measured ~15 min on ubuntu-24.04: the repository script-test suite alone is
        # ~8-9 min and runs last, so the old 15-minute budget cut the step off mid-suite
        # (the job then fails with a timeout rather than a finding). Keep headroom.
        timeout-minutes: 25
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          CHECK_REF: ${{ inputs.ref || github.ref }}
        run: |
          base="${PR_BASE:-origin/dev}"
          # An isolated release must check its own complete changes, not
          # reversals of interface migrations that landed on dev afterwards.
          if [ -z "$PR_BASE" ] && [[ "$CHECK_REF" =~ ^(refs/(heads|tags)/)?v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            base="$(git merge-base HEAD origin/dev)"
          fi
          echo "Source-quality comparison base: $base"
          make check CI_BASE="$base"

  profile-matrix:
    name: Profile ${{ matrix.profile }}
    # Pull requests already run the toolchain-free profile contract check in
    # source-quality. Full configure/build/smoke coverage belongs to dev
    # pushes, scheduled/manual runs and release workflow calls.
    needs: [source-quality, change-scope]
    if: ${{ needs.source-quality.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    strategy:
      fail-fast: false
      matrix:
        profile: [minimal, 2d, 3d, procgen-core-only, physics-core-only, asset-core-only, headless, server]
    env:
      PROFILE: ${{ matrix.profile }}
      PROFILE_BUILD_ROOT: /tmp/evengine-profile-matrix
      PROFILE_JOBS: 2
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Install profile toolchain
        timeout-minutes: 15
        run: |
          # Only Ubuntu indexes are needed for this toolchain.
          test -s /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=- -o Acquire::Retries=2
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libvulkan-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxext-dev libxss-dev libwayland-dev libxkbcommon-dev \
            libbz2-dev libpng-dev libxxf86vm-dev libasound2-dev

      - name: Configure profile
        timeout-minutes: 30
        run: make profile/configure

      - name: Build independent profile smoke target
        # Cold 3d builds reached 1609/1758 edges at the old 35-minute limit.
        timeout-minutes: 60
        run: make profile/build

      - name: Run independent capability smoke probes
        timeout-minutes: 10
        run: make profile/smoke

  tool-tests:
    name: Standalone Python tools
    needs: [source-quality, change-scope]
    if: ${{ needs.source-quality.result == 'success' && needs.change-scope.outputs.tools == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Python test dependencies
        timeout-minutes: 10
        run: |
          python3 -m pip install --user --quiet \
            pytest pydantic requests numpy opencv-python-headless pillow ffmpy ruff

      - name: Ruff lint standalone tools
        timeout-minutes: 5
        run: python3 -m ruff check tools

      - name: Test asset-pipeline-agent
        timeout-minutes: 5
        run: cd tools/asset-pipeline-agent && python3 -m unittest discover -s tests -v

      - name: Test scene-qc-agent
        timeout-minutes: 5
        run: cd tools/scene-qc-agent && python3 -m unittest discover -s tests -v

      - name: Test creative-brain
        timeout-minutes: 5
        run: cd tools/creative-brain && python3 -m pytest -q

      - name: Test normal-crafter (client)
        timeout-minutes: 5
        run: cd tools/normal-crafter && python3 -m pytest -q test

      - name: Test story-scene-agent
        timeout-minutes: 5
        run: PYTHONPATH=tools/creative-brain python3 -m pytest -q tools/story-scene-agent/tests

      - name: Test vision-prefilter
        timeout-minutes: 5
        run: cd tools/vision-prefilter && python3 -m pytest -q test

  # Native architecture lanes compile and link the engine and test binaries.
  # Runtime GPU/ICD coverage remains in the existing host lanes.
  macos-x86_64:
    name: macOS x86_64 (${{ matrix.configuration }}, build)
    needs: [source-quality, change-scope]
    if: ${{ needs.source-quality.result == 'success' && needs.change-scope.outputs.macos == 'true' }}
    runs-on: macos-15-intel
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(inputs.build_type == 'both' && '["debug","release"]' || inputs.build_type == 'release' && '["release"]' || '["debug"]') }}
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Verify native Intel runner
        timeout-minutes: 5
        run: test "$(uname -s)" = Darwin && test "$(uname -m)" = x86_64

      - name: Install build tools
        timeout-minutes: 10
        run: brew install ninja

      - name: Install Vulkan SDK (MoltenVK)
        timeout-minutes: 20
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1
        with:
          vulkan_version: ${{ env.VULKAN_VERSION }}
          destination: ${{ runner.temp }}/VulkanSDK
          cache: true
          cache_save_if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Vulkan SDK paths
        timeout-minutes: 5
        run: bash .github/scripts/resolve-vulkan-macos.sh "${{ runner.temp }}/VulkanSDK"

      - name: Build macOS x86_64
        timeout-minutes: 140
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          suffix=""
          if [ "$CONFIGURATION" = debug ]; then suffix="-debug"; fi
          mkdir -p build
          log="build/macosx-x86_64${suffix}.log"
          if make "build/macosx-x86_64${suffix}" JOBS=4 \
            CMAKE_EXTRA_ARGS="-DEVENGINE_THIRD_PARTY_MODE=PREBUILT -DEVENGINE_COMPILER_CACHE=OFF" >"$log" 2>&1; then
            tail -n 30 "$log"
          else
            awk '/error:|FAILED:|Undefined symbols|^ld:/ {remaining=12} remaining>0 {if (shown++ < 240) print; remaining--}' "$log"
            tail -n 40 "$log"
            exit 1
          fi

      - name: Upload Intel macOS build diagnostics
        if: failure()
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macosx-x86_64-${{ matrix.configuration }}-build-logs
          path: build/macosx-x86_64*.log
          if-no-files-found: ignore

  # Native ARM64 lanes also run the process-isolated tests and validate SDKs.
  windows-arm64:
    name: Windows ARM64 (${{ matrix.configuration }}, build + test)
    needs: [source-quality, change-scope]
    if: ${{ needs.source-quality.result == 'success' && needs.change-scope.outputs.windows == 'true' }}
    runs-on: windows-11-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(inputs.build_type == 'both' && '["debug","release"]' || inputs.build_type == 'release' && '["release"]' || '["debug"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Verify native ARM64 runner
        timeout-minutes: 5
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') {
            throw 'This lane requires a native Windows ARM64 host'
          }

      - name: Install build tools
        timeout-minutes: 15
        shell: pwsh
        run: |
          choco install make ninja -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install native ARM64 Vulkan SDK
        timeout-minutes: 20
        # This pinned action selects the Windows ARM64 SDK from the host arch.
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1
        with:
          vulkan_version: ${{ env.VULKAN_VERSION }}
          cache: true
          cache_save_if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup native software Vulkan
        timeout-minutes: 90
        uses: ./.github/actions/setup-arm64-vulkan

      - name: Probe native Vulkan driver and loader surface extensions
        timeout-minutes: 5
        env:
          VK_LOADER_DEBUG: error,warn
        run: |
          cmake/with-msvc.cmd --arm64 cmake -G Ninja -S .github/scripts/vulkan-probe -B build/arm64-vulkan-probe -DCMAKE_BUILD_TYPE=Release
          cmake/with-msvc.cmd --arm64 cmake --build build/arm64-vulkan-probe
          build/arm64-vulkan-probe/vulkan_probe.exe "$PWD/build/arm64-swiftshader-runtime/vk_swiftshader.dll" "$EVE_VULKAN_LOADER"

      - name: Build Windows ARM64
        timeout-minutes: 190
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          suffix=""
          if [ "$CONFIGURATION" = debug ]; then suffix="-debug"; fi
          make "build/win32-arm64${suffix}" JOBS=4 \
            CMAKE_EXTRA_ARGS="-DEVENGINE_THIRD_PARTY_MODE=PREBUILT -DEVENGINE_COMPILER_CACHE=OFF"
          # Executable-local lookup precedes any system Vulkan loader.
          cp "$EVE_VULKAN_LOADER" "build/win32-arm64${suffix}/test/vulkan-1.dll"
          cp "$EVE_VULKAN_LOADER" "build/win32-arm64${suffix}/src/engine/vulkan-1.dll"

      - name: Probe real SDL Vulkan window with loader diagnostics
        timeout-minutes: 5
        env:
          ALSOFT_DRIVERS: "null"
          VK_LOADER_DEBUG: all
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          suffix=""
          if [ "$CONFIGURATION" = debug ]; then suffix="-debug"; fi
          ctest --test-dir "build/win32-arm64${suffix}" --no-tests=error -V -R '^WindowTest\.basicWindow$'

      - name: Run Windows ARM64 tests
        timeout-minutes: 90
        env:
          ALSOFT_DRIVERS: "null"
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          suffix=""
          if [ "$CONFIGURATION" = debug ]; then suffix="-debug"; fi
          make "test/win32-arm64${suffix}" JOBS=4 CTEST_JOBS=2 \
            LABEL_FILTER='${{ needs.change-scope.outputs.test_label_regex }}' \
            CMAKE_EXTRA_ARGS="-DEVENGINE_THIRD_PARTY_MODE=PREBUILT -DEVENGINE_COMPILER_CACHE=OFF"

      - name: Install and validate Windows ARM64 Release SDK
        if: matrix.configuration == 'release'
        timeout-minutes: 20
        env:
          ALSOFT_DRIVERS: "null"
          SDK_TEST_ARCH: arm64
          SDK_TEST_REQUIRE_RUN: "1"
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          suffix=""
          cmake --install "build/win32-arm64${suffix}" --prefix "dist/eve-sdk/win32-arm64${suffix}"
          version="$(cat "dist/eve-sdk/win32-arm64${suffix}/share/eve/VERSION")"
          python3 .github/scripts/zip-sdk.py win32-arm64 ci
          bash .github/scripts/test-arm64-sdk.sh artifacts/eve-sdk-win32-arm64-ci.zip win32 "$version"

      - name: Upload ARM64 test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: win32-arm64-${{ matrix.configuration }}-test-logs
          path: build/win32-arm64*/Testing/Temporary/
          if-no-files-found: ignore

  linux-arm64:
    name: Linux ARM64 (${{ matrix.configuration }}, build + test)
    needs: [source-quality, change-scope]
    if: ${{ needs.source-quality.result == 'success' && needs.change-scope.outputs.linux == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(inputs.build_type == 'both' && '["debug","release"]' || inputs.build_type == 'release' && '["release"]' || '["debug"]') }}
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Verify native ARM64 runner
        timeout-minutes: 5
        run: test "$(uname -m)" = aarch64

      - name: Install native system packages
        timeout-minutes: 25
        # Preserve the ARM ports mirror supplied by the runner image.
        run: |
          sudo apt-get update -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build lld gdb \
            libx11-dev libxxf86vm-dev libxi-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev libxext-dev libxss-dev \
            libgl1-mesa-dev libbz2-dev libpng-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev \
            libvulkan-dev glslc glslang-tools \
            mesa-vulkan-drivers vulkan-tools vulkan-validationlayers xvfb xauth

      - name: Setup native software Vulkan
        timeout-minutes: 90
        uses: ./.github/actions/setup-arm64-vulkan

      - name: Build Linux ARM64
        timeout-minutes: 140
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          suffix=""
          if [ "$CONFIGURATION" = debug ]; then suffix="-debug"; fi
          make "build/linux-arm64${suffix}" JOBS=4 \
            CMAKE_EXTRA_ARGS="-DEVENGINE_THIRD_PARTY_MODE=PREBUILT -DEVENGINE_COMPILER_CACHE=OFF"

      - name: Probe ray tracing with validation and backtraces
        timeout-minutes: 10
        env:
          ALSOFT_DRIVERS: "null"
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          suffix=""
          if [ "$CONFIGURATION" = debug ]; then suffix="-debug"; fi
          bash .github/scripts/probe-arm64-blas.sh
          python3 .github/scripts/probe-raytracing.py "build/linux-arm64${suffix}"

      - name: Run Linux ARM64 tests
        timeout-minutes: 90
        env:
          ALSOFT_DRIVERS: "null"
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          suffix=""
          if [ "$CONFIGURATION" = debug ]; then suffix="-debug"; fi
          xvfb-run -a make "test/linux-arm64${suffix}" JOBS=4 CTEST_JOBS=2 \
            LABEL_FILTER='${{ needs.change-scope.outputs.test_label_regex }}' \
            CMAKE_EXTRA_ARGS="-DEVENGINE_THIRD_PARTY_MODE=PREBUILT -DEVENGINE_COMPILER_CACHE=OFF"

      - name: Install and validate Linux ARM64 Release SDK
        if: matrix.configuration == 'release'
        timeout-minutes: 20
        env:
          ALSOFT_DRIVERS: "null"
          SDK_TEST_ARCH: arm64
          SDK_TEST_REQUIRE_RUN: "1"
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          suffix=""
          cmake --install "build/linux-arm64${suffix}" --prefix "dist/eve-sdk/linux-arm64${suffix}"
          version="$(cat "dist/eve-sdk/linux-arm64${suffix}/share/eve/VERSION")"
          python3 .github/scripts/zip-sdk.py linux-arm64 ci
          xvfb-run -a bash .github/scripts/test-arm64-sdk.sh artifacts/eve-sdk-linux-arm64-ci.zip linux "$version"

      - name: Upload ARM64 test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-arm64-${{ matrix.configuration }}-test-logs
          path: build/linux-arm64*/Testing/Temporary/
          if-no-files-found: ignore

  windows:
    name: Windows
    needs: [source-quality, change-scope]
    if: ${{ needs.source-quality.result == 'success' && needs.change-scope.outputs.windows == 'true' && (github.event_name != 'workflow_call' || inputs.build_type == 'debug' || inputs.build_type == 'both') }}
    runs-on: windows-latest
    # Vulkan build and unit tests; Dawn has its own independent job.
    timeout-minutes: 240
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: evengine-cpp-v1-windows-x64
      # Pull-request cache entries are scoped to refs/pull/*/merge and cannot
      # warm other PRs. Let PRs consume the dev cache without duplicating it.
      SCCACHE_GHA_RW_MODE: ${{ (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/v') || startsWith(inputs.ref, 'v')) && 'READ_WRITE' || 'READ_ONLY' }}
      SCCACHE_DIRECT: "false"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Install build tools
        timeout-minutes: 15
        shell: pwsh
        run: |
          choco install make ninja -y --no-progress
          echo "VS_GENERATOR=Visual Studio 17 2022" >> $env:GITHUB_ENV

      - name: Setup C/C++ compilation cache
        timeout-minutes: 10
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Vulkan SDK
        timeout-minutes: 20
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1
        with:
          vulkan_version: ${{ env.VULKAN_VERSION }}
          install_runtime: true
          # Headless Windows runners have no GPU ICD; SwiftShader provides
          # VK_KHR_surface so SDL_WINDOW_VULKAN / unit tests can run.
          install_swiftshader: true
          cache: true
          cache_save_if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup software Vulkan ICD (SwiftShader)
        timeout-minutes: 5
        run: bash .github/scripts/setup-software-vulkan.sh

      - name: Identify third-party toolchain
        id: third-party-toolchain
        timeout-minutes: 5
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $toolsetFile = Join-Path $vsRoot "VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt"
          $toolset = (Get-Content $toolsetFile -Raw).Trim()
          $sdkVersion = (& cmd.exe /d /s /c `
            'cmake\with-msvc.cmd cmd.exe /d /c echo %WindowsSDKVersion%').Trim().TrimEnd('\')
          $cmakeVersion = ((cmake --version | Select-Object -First 1) -split '\s+')[-1]
          "id=msvc-$toolset-winsdk-$sdkVersion-cmake-$cmakeVersion" >> $env:GITHUB_OUTPUT

      - name: Restore verified third-party cache
        id: third-party-cache
        timeout-minutes: 20
        uses: ./.github/actions/restore-third-party
        with:
          platform: win32
          configuration: Debug
          toolchain: ${{ steps.third-party-toolchain.outputs.id }}

      - name: Build win32 debug
        # Dependencies come from the pinned independent release; this job
        # compiles the engine/tests and caches verified downloaded packages.
        timeout-minutes: 100
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make build/win32-debug JOBS="${NUMBER_OF_PROCESSORS:-8}" \
            CMAKE_EXTRA_ARGS="-DEVENGINE_ENABLE_STRICT_WARNINGS=ON \
              -DEVENGINE_COMPILER_CACHE=SCCACHE ${{ steps.third-party-cache.outputs.cmake-args }}"

      - name: Verify Windows compiler cache reuse
        timeout-minutes: 5
        shell: pwsh
        run: cmake\with-msvc.cmd pwsh -NoProfile -File .github/scripts/verify-windows-compiler-cache.ps1 -BuildDir build/win32-debug

      - name: Verify built third-party cache
        timeout-minutes: 5
        run: bash .github/scripts/verify-third-party-cache.sh "${{ steps.third-party-cache.outputs.prefix }}" win32 Debug build/win32-debug/CMakeCache.txt

      - name: Save third-party cache
        if: >-
          steps.third-party-cache.outputs.cache-hit != 'true' &&
          (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' ||
           startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/v') || startsWith(inputs.ref, 'v'))
        timeout-minutes: 15
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.third-party-cache.outputs.path }}
          key: ${{ steps.third-party-cache.outputs.key }}

      - name: Report C/C++ compilation cache
        if: always()
        timeout-minutes: 5
        run: sccache --show-stats

      - name: Run win32 unit tests
        # Run 39399072292 reached only 5042/7039 cases before the 50-minute
        # guard fired. The expanded full suite needs room for the remaining
        # cases; individual CTest timeouts still bound hung tests.
        timeout-minutes: 90
        # Headless runners have no WASAPI endpoint (0x80070490); OpenAL Soft null backend.
        env:
          ALSOFT_DRIVERS: "null"
        run: >-
          make test/win32-debug
          LABEL_FILTER='${{ needs.change-scope.outputs.test_label_regex }}'

      - name: Upload Windows test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-failure-logs
          path: |
            build/win32-debug/Testing/Temporary/LastTestsFailed.log
            build/win32-debug/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  dawn:
    name: Dawn (Linux smoke)
    needs: [source-quality, change-scope]
    if: ${{ needs.source-quality.result == 'success' && needs.change-scope.outputs.dawn == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: evengine-cpp-v1-linux-x64
      # Populate shared caches only from long-lived branches; PR-scoped writes
      # are dead stores after that PR closes and quickly evict reusable entries.
      SCCACHE_GHA_RW_MODE: ${{ (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/v') || startsWith(inputs.ref, 'v')) && 'READ_WRITE' || 'READ_ONLY' }}
      SCCACHE_DIRECT: "false"
      CC: gcc
      CXX: g++
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Install system packages
        # apt update may consume most of ten minutes while retrying a slow
        # mirror, and Mesa can download at well below 100 KiB/s. Keep enough
        # time for an active transfer to finish.
        timeout-minutes: 25
        run: |
          # GitHub-hosted ubuntu-24.04 images sometimes pin the retired
          # azure.archive.ubuntu.com mirror, which hangs instead of failing.
          # Normalize to the canonical mirror so apt has a reachable source.
          sudo sed -i -E 's#https?://[^/]*archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | \
            sudo tee /etc/apt/apt.conf.d/90eve-timeouts >/dev/null
          sudo pkill -f "unattended-upgrade" || true
          sudo systemctl stop apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          # Only Ubuntu indexes are needed for this toolchain.
          test -s /etc/apt/sources.list.d/ubuntu.sources
          apt_ok=0
          for i in 1 2 3; do
            timeout 120 sudo apt-get update -o Acquire::Retries=2 \
              -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
              -o Dir::Etc::sourceparts=- \
              -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 && { apt_ok=1; break; }
            [ "$i" -lt 3 ] && sleep 20
          done
          [ "$apt_ok" -eq 1 ] || exit 1
          # Package downloads can exceed the old ten-minute step budget.
          # Keep bounded transport retries and signature/hash verification.
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libx11-dev libx11-xcb-dev libxcb1-dev libxxf86vm-dev libxi-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev libxext-dev libxss-dev \
            libgl1-mesa-dev libgbm-dev libdrm-dev \
            libbz2-dev libpng-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev \
            mesa-vulkan-drivers vulkan-tools \
            xvfb xauth
          # Check Dawn platform headers before starting the dependency build.
          printf '#include <X11/Xlib-xcb.h>\n#include <gbm.h>\n#include <xf86drm.h>\n' | \
            g++ $(pkg-config --cflags gbm libdrm) -x c++ -fsyntax-only -

      - name: Setup C/C++ compilation cache
        timeout-minutes: 10
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Identify third-party toolchain
        id: third-party-toolchain
        timeout-minutes: 5
        run: bash .github/scripts/identify-third-party-toolchain.sh linux >> "$GITHUB_OUTPUT"

      - name: Restore verified third-party cache
        id: third-party-cache
        timeout-minutes: 20
        uses: ./.github/actions/restore-third-party
        with:
          platform: linux
          configuration: Debug
          toolchain: ${{ steps.third-party-toolchain.outputs.id }}

      - name: Install Vulkan SDK
        timeout-minutes: 20
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1
        with:
          vulkan_version: ${{ env.VULKAN_VERSION }}
          cache: true
          cache_save_if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup software Vulkan ICD (Lavapipe)
        timeout-minutes: 5
        run: bash .github/scripts/setup-software-vulkan.sh

      - name: Setup Dawn generator Python
        timeout-minutes: 5
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Configure native Dawn smoke lane
        # Reset incomplete dependency checkouts before retrying configuration.
        timeout-minutes: 25
        run: |
          set -euo pipefail
          third_party_args=()
          if [ "${{ steps.third-party-cache.outputs.cache-hit }}" = "true" ]; then
            third_party_args+=("${{ steps.third-party-cache.outputs.cmake-args }}")
          fi
          # Bash 3.2 treats empty arrays as unset under nounset.
          configure_dawn() {
            cmake -S . -B build/webgpu-native -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DEVENGINE_BUILD_PLATFORM=webgpu -DBUILD_PLATFORM=webgpu -DBUILD_TESTING=ON \
              -DEVENGINE_COMPILER_CACHE=SCCACHE \
              ${third_party_args[@]+"${third_party_args[@]}"} \
              -DEVENGINE_DOWNLOAD_SPINE_MODELS=OFF \
              -DEVENGINE_DOWNLOAD_SKINNED_CHARACTER=OFF
          }
          for attempt in 1 2 3; do
            echo "Dawn smoke configure attempt ${attempt}/3"
            # CMake validates the pinned support checkouts in eve_dawn_support.
            if configure_dawn; then
              exit 0
            fi
            rm -rf build/webgpu-native
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          echo 'Dawn smoke configure failed after 3 attempts' >&2
          exit 1

      - name: Verify native Dawn platform selection
        timeout-minutes: 5
        run: |
          set -euo pipefail
          grep -Eq '^#define EVENGINE_WEBGPU[[:space:]]*$' \
            build/webgpu-native/src/engine/common/config.h
          grep -Eq 'graphics/webgpu/' build/webgpu-native/src/modules/graphics_src.txt
          if grep -Eq 'graphics/vulkan/' build/webgpu-native/src/modules/graphics_src.txt; then
            echo 'native Dawn graphics source list still contains Vulkan' >&2
            exit 1
          fi

      - name: Build native Dawn smoke lane
        # Build dependencies explicitly so a cold independent runner works too.
        timeout-minutes: 180
        run: |
          set -euo pipefail
          cmake --build build/webgpu-native --target deps -j "$(nproc)"
          cmake --build build/webgpu-native --target unit_test -j "$(nproc)"

      - name: Report native Dawn compilation cache
        if: always()
        timeout-minutes: 5
        run: sccache --show-stats

      - name: Run native Dawn smoke
        timeout-minutes: 10
        env:
          ALSOFT_DRIVERS: "null"
          SDL_VIDEODRIVER: x11
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          trap 'rm -rf "$XDG_RUNTIME_DIR"' EXIT
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ctest --test-dir build/webgpu-native \
              -R '^Graphics\.screenGetPixelAfterPresent$' \
              --no-tests=error --timeout 300 --output-on-failure

  windows-release:
    name: Windows (Release)
    needs: [source-quality, change-scope]
    if: ${{ needs.source-quality.result == 'success' && needs.change-scope.outputs.windows == 'true' && (inputs.build_type == 'release' || inputs.build_type == 'both') }}
    runs-on: windows-latest
    # A cold Release build took 55 minutes and the process-isolated 3510-case
    # suite reached 3060/3510 at the former 30-minute test guard. Preserve
    # bounded hang detection while budgeting setup, build, and the full suite.
    timeout-minutes: 300
    env:
      SCCACHE_GHA_ENABLED: "true"
