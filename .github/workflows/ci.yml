name: PR701 followup diagnostics
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        default: both
        options: [both, linux, intel, intel_fresh, dawn_full, intel_full, loader]
permissions:
  contents: read
  actions: read
env:
  VULKAN_VERSION: "1.4.363.0"
jobs:
  dawn-macro:
    if: ${{ inputs.target == 'both' || inputs.target == 'linux' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-dev
      - name: Validate the X11 boundary against pinned WebGPU headers
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/google/dawn/releases/download/v20260423.175430/emdawnwebgpu_pkg-v20260423.175430.zip -o "$RUNNER_TEMP/dawn-probe.zip"
          echo '3ad7ebe95a4a20764df46c5a63b0ad489782aee26804fff8511d9797c10e732f  '"$RUNNER_TEMP/dawn-probe.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/dawn-probe.zip" -d "$RUNNER_TEMP/dawn-probe"
          header=$(find "$RUNNER_TEMP/dawn-probe" -path '*/webgpu/webgpu_cpp.h' -print -quit)
          include=$(dirname "$(dirname "$header")")
          c_header=$(find "$RUNNER_TEMP/dawn-probe" -path '*/webgpu/webgpu.h' -print -quit)
          c_include=$(dirname "$(dirname "$c_header")")
          python3 .github/diagnostics/pr701-followup/macro_probe.py
          if g++ -std=c++20 -fsyntax-only $(sdl2-config --cflags) -I"$include" -I"$c_include" /tmp/pr701-before.cpp >/tmp/pr701-before.log 2>&1; then
            echo 'Expected the old include boundary to expose the X11 macro conflict'
            exit 1
          fi
          cat /tmp/pr701-before.log
          g++ -std=c++20 -Wall -Wextra -Werror -fsyntax-only $(sdl2-config --cflags) -I"$include" -I"$c_include" /tmp/pr701-after.cpp
  intel-uv:
    if: ${{ inputs.target == 'both' || inputs.target == 'intel' }}
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533
        with:
          vulkan_version: '1.4.363.0'
          cache: true
          destination: ${{ runner.temp }}/VulkanSDK
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: bash .github/scripts/resolve-vulkan-macos.sh "${{ runner.temp }}/VulkanSDK"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: EVEngine/third-party
          ref: e7e0a476be19a05839add497c29482c372f2c484
          path: probe-third-party
          sparse-checkout: |
            glm
            medialoader
            SDL2
            VKBuilder
            vulkan
            vk_video
            vma
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: assimp/assimp
          ref: c35200e38ea8f058812b83de2ef32c6093b0ece2
          path: probe-assimp
          sparse-checkout: include
      - name: Reproduce glTF frames through the existing Intel SDK
        env:
          GH_TOKEN: ${{ github.token }}
          EVENGINE_VULKAN_VALIDATION: '1'
          MVK_CONFIG_LOG_LEVEL: '4'
        run: |
          set -euo pipefail
          git -C probe-third-party submodule update --init --depth 1 medialoader SDL2 VKBuilder
          gh run download 41299927015 --repo github.com/EVEngine/EVEngine --name sdk-macosx-x86_64 --dir "$RUNNER_TEMP/sdk-download"
          unzip -q "$RUNNER_TEMP/sdk-download/eve-sdk-macosx-x86_64-v0.6.1.zip" -d "$RUNNER_TEMP/sdk"
          sdk="$RUNNER_TEMP/sdk/eve-sdk/macosx-x86_64"
          cmake -S .github/diagnostics/pr701-followup/sdk-plugin -B build/followup-plugin -DEVEngine_DIR="$sdk/cmake" -DPROBE_TP_DIR="$GITHUB_WORKSPACE/probe-third-party" -DPROBE_ASSIMP_DIR="$GITHUB_WORKSPACE/probe-assimp" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/followup-plugin --parallel 2
          cp build/followup-plugin/pr701_probe.dylib .github/diagnostics/pr701-followup/sdk-game/
          python3 .github/diagnostics/pr701-followup/run_sdk.py "$sdk/bin/eve"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr701-intel-uv-probe
          path: |
            engine-probe*.log
            engine-probe-sample.txt

  dawn:
    name: Dawn (Linux smoke)
    if: ${{ inputs.target == 'dawn_full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          submodules: recursive

      - name: Install system packages
        # apt update may consume most of ten minutes while retrying a slow
        # mirror, and Mesa can download at well below 100 KiB/s. Keep enough
        # time for an active transfer to finish.
        timeout-minutes: 25
        run: |
          # GitHub-hosted ubuntu-24.04 images sometimes pin the retired
          # azure.archive.ubuntu.com mirror, which hangs instead of failing.
          # Normalize to the canonical mirror so apt has a reachable source.
          sudo sed -i -E 's#https?://[^/]*archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | \
            sudo tee /etc/apt/apt.conf.d/90eve-timeouts >/dev/null
          sudo pkill -f "unattended-upgrade" || true
          sudo systemctl stop apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          # Only Ubuntu indexes are needed for this toolchain.
          test -s /etc/apt/sources.list.d/ubuntu.sources
          apt_ok=0
          for i in 1 2 3; do
            timeout 120 sudo apt-get update -o Acquire::Retries=2 \
              -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
              -o Dir::Etc::sourceparts=- \
              -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 && { apt_ok=1; break; }
            [ "$i" -lt 3 ] && sleep 20
          done
          [ "$apt_ok" -eq 1 ] || exit 1
          # Package downloads can exceed the old ten-minute step budget.
          # Keep bounded transport retries and signature/hash verification.
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libx11-dev libx11-xcb-dev libxcb1-dev libxxf86vm-dev libxi-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev libxext-dev libxss-dev \
            libgl1-mesa-dev libgbm-dev libdrm-dev \
            libbz2-dev libpng-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev \
            mesa-vulkan-drivers vulkan-tools \
            xvfb xauth
          # Check Dawn platform headers before starting the dependency build.
          printf '#include <X11/Xlib-xcb.h>\n#include <gbm.h>\n#include <xf86drm.h>\n' | \
            g++ $(pkg-config --cflags gbm libdrm) -x c++ -fsyntax-only -

      - name: Identify third-party toolchain
        id: third-party-toolchain
        timeout-minutes: 5
        run: bash .github/scripts/identify-third-party-toolchain.sh linux >> "$GITHUB_OUTPUT"

      - name: Restore verified third-party cache
        id: third-party-cache
        timeout-minutes: 20
        uses: ./.github/actions/restore-third-party
        with:
          platform: linux
          configuration: Debug
          toolchain: ${{ steps.third-party-toolchain.outputs.id }}

      - name: Install Vulkan SDK
        timeout-minutes: 20
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1
        with:
          vulkan_version: ${{ env.VULKAN_VERSION }}
          cache: true
          cache_save_if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup software Vulkan ICD (Lavapipe)
        timeout-minutes: 5
        run: bash .github/scripts/setup-software-vulkan.sh

      - name: Setup Dawn generator Python
        timeout-minutes: 5
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Configure native Dawn smoke lane
        # Reset incomplete dependency checkouts before retrying configuration.
        timeout-minutes: 25
        run: |
          set -euo pipefail
          third_party_args=()
          if [ "${{ steps.third-party-cache.outputs.cache-hit }}" = "true" ]; then
            third_party_args+=("${{ steps.third-party-cache.outputs.cmake-args }}")
          fi
          configure_dawn() {
            cmake -S . -B build/webgpu-native -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DEVENGINE_BUILD_PLATFORM=webgpu -DBUILD_PLATFORM=webgpu -DBUILD_TESTING=ON \
              -DEVENGINE_COMPILER_CACHE=OFF \
              "${third_party_args[@]}" \
              -DEVENGINE_DOWNLOAD_SPINE_MODELS=OFF \
              -DEVENGINE_DOWNLOAD_SKINNED_CHARACTER=OFF
          }
          for attempt in 1 2 3; do
            echo "Dawn smoke configure attempt ${attempt}/3"
            # CMake validates the pinned support checkouts in eve_dawn_support.
            if configure_dawn; then
              exit 0
            fi
            rm -rf build/webgpu-native
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          echo 'Dawn smoke configure failed after 3 attempts' >&2
          exit 1

      - name: Verify native Dawn platform selection
        timeout-minutes: 5
        run: |
          set -euo pipefail
          grep -Eq '^#define EVENGINE_WEBGPU[[:space:]]*$' \
            build/webgpu-native/src/engine/common/config.h
          grep -Eq 'graphics/webgpu/' build/webgpu-native/src/modules/graphics_src.txt
          if grep -Eq 'graphics/vulkan/' build/webgpu-native/src/modules/graphics_src.txt; then
            echo 'native Dawn graphics source list still contains Vulkan' >&2
            exit 1
          fi

      - name: Build native Dawn smoke lane
        # Build dependencies explicitly so a cold independent runner works too.
        timeout-minutes: 180
        run: |
          set -euo pipefail
          cmake --build build/webgpu-native --target deps -j "$(nproc)"
          cmake --build build/webgpu-native --target unit_test -j "$(nproc)"

      - name: Run native Dawn smoke
        timeout-minutes: 10
        env:
          ALSOFT_DRIVERS: "null"
          SDL_VIDEODRIVER: x11
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          trap 'rm -rf "$XDG_RUNTIME_DIR"' EXIT
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ctest --test-dir build/webgpu-native \
              -R '^Graphics\.screenGetPixelAfterPresent$' \
              --no-tests=error --timeout 300 --output-on-failure

  intel-fresh:
    if: ${{ inputs.target == 'intel_fresh' }}
    strategy:
      fail-fast: false
      matrix:
        first: [baseline, semaphore, semaphore_repeat, callback]
    env:
      UV_FIRST_MODE: ${{ matrix.first }}
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533
        with:
          vulkan_version: '1.4.363.0'
          cache: true
          destination: ${{ runner.temp }}/VulkanSDK
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: bash .github/scripts/resolve-vulkan-macos.sh "${{ runner.temp }}/VulkanSDK"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: EVEngine/third-party
          ref: e7e0a476be19a05839add497c29482c372f2c484
          path: probe-third-party
          sparse-checkout: |
            glm
            medialoader
            SDL2
            VKBuilder
            vulkan
            vk_video
            vma
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: assimp/assimp
          ref: c35200e38ea8f058812b83de2ef32c6093b0ece2
          path: probe-assimp
          sparse-checkout: include
      - name: Reproduce glTF frames through the existing Intel SDK
        env:
          GH_TOKEN: ${{ github.token }}
          EVENGINE_VULKAN_VALIDATION: '1'
          MVK_CONFIG_LOG_LEVEL: '4'
        run: |
          set -euo pipefail
          git -C probe-third-party submodule update --init --depth 1 medialoader SDL2 VKBuilder
          gh run download 41299927015 --repo github.com/EVEngine/EVEngine --name sdk-macosx-x86_64 --dir "$RUNNER_TEMP/sdk-download"
          unzip -q "$RUNNER_TEMP/sdk-download/eve-sdk-macosx-x86_64-v0.6.1.zip" -d "$RUNNER_TEMP/sdk"
          sdk="$RUNNER_TEMP/sdk/eve-sdk/macosx-x86_64"
          cmake -S .github/diagnostics/pr701-followup/sdk-plugin -B build/followup-plugin -DEVEngine_DIR="$sdk/cmake" -DPROBE_TP_DIR="$GITHUB_WORKSPACE/probe-third-party" -DPROBE_ASSIMP_DIR="$GITHUB_WORKSPACE/probe-assimp" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/followup-plugin --parallel 2
          cp build/followup-plugin/pr701_probe.dylib .github/diagnostics/pr701-followup/sdk-game/
          python3 .github/diagnostics/pr701-followup/run_sdk.py "$sdk/bin/eve"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr701-intel-fresh-${{ matrix.first }}
          path: |
            engine-probe*.log
            engine-probe-sample.txt

  macos-x86_64:
    name: macOS x86_64 (${{ matrix.configuration }}, build + test)
    if: ${{ inputs.target == 'intel_full' }}
    env:
      MVK_CONFIG_VK_SEMAPHORE_SUPPORT_STYLE: '0'
      MVK_CONFIG_USE_METAL_ARGUMENT_BUFFERS: '0'
    runs-on: macos-15-intel
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Verify native Intel runner
        timeout-minutes: 5
        run: test "$(uname -s)" = Darwin && test "$(uname -m)" = x86_64

      - name: Install build tools
        timeout-minutes: 10
        run: brew install ninja

      - name: Install Vulkan SDK (MoltenVK)
        timeout-minutes: 20
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1
        with:
          vulkan_version: ${{ env.VULKAN_VERSION }}
          destination: ${{ runner.temp }}/VulkanSDK
          cache: true
          cache_save_if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Vulkan SDK paths
        timeout-minutes: 5
        run: bash .github/scripts/resolve-vulkan-macos.sh "${{ runner.temp }}/VulkanSDK"

      - name: Build macOS x86_64
        timeout-minutes: 140
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          suffix=""
          if [ "$CONFIGURATION" = debug ]; then suffix="-debug"; fi
          mkdir -p build
          log="build/macosx-x86_64${suffix}.log"
          if make "build/macosx-x86_64${suffix}" JOBS=4 \
            CMAKE_EXTRA_ARGS="-DEVENGINE_THIRD_PARTY_MODE=PREBUILT -DEVENGINE_COMPILER_CACHE=OFF" >"$log" 2>&1; then
            tail -n 30 "$log"
          else
            awk '/error:|FAILED:|Undefined symbols|^ld:/ {remaining=12} remaining>0 {if (shown++ < 240) print; remaining--}' "$log"
            tail -n 40 "$log"
            exit 1
          fi

      - name: Preserve native test binary for bounded follow-up diagnosis
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          suffix=""
          if [ "$CONFIGURATION" = debug ]; then suffix="-debug"; fi
          mkdir -p build/native-runtime
          cp "build/macosx-x86_64${suffix}/test/unit_test" build/native-runtime/
          find build/third-party-releases -path '*/lib/*.dylib' \( -type f -o -type l \) -exec cp -L {} build/native-runtime/ \;
          otool -L build/native-runtime/unit_test > build/native-runtime/dependencies.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr701-intel-native-${{ matrix.configuration }}
          path: build/native-runtime/
          retention-days: 3
      - name: Validate Intel macOS rendering before the full suite
        timeout-minutes: 20
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          ALSOFT_DRIVERS: "null"
          EVENGINE_VULKAN_VALIDATION: "1"
        run: |
          suffix=""
          if [ "$CONFIGURATION" = debug ]; then suffix="-debug"; fi
          # Cover independent paths in one bounded pass, so one blank map does
          # not hide texture, skinning, frame-slot or compute failures.
          ctest --test-dir "build/macosx-x86_64${suffix}" --output-on-failure -j 1 \
            --timeout 120 --no-tests=error \
            -R '^(map\.render\.orthoAndIsoPreview|spritestack\.render\.(pure2DStack|rotationChangesPixels)|model3d\.render\.gltfEmbeddedUvOrientation|animation\.skinned\.render\.bindPose|graphics\.frameRecording\.fxaaSlotReuseResizeAndPersistentCanvas|fluids\.ocean\.gpuSpectrumMatchesCpuAndRejectsStaleFrames|graphics\.resources\.customProgramsDoNotReserveUnusedMaterialSamplers|graphics\.headless\.initCanvasDrawAndErrors|graphics\.backendParity\.primitive2DAnd3DReadback|gpgpu\.dispatch\.scaleFloats|procgen\.roguelike\.bothLBendsConnectAllRooms)$'

      - name: Run native Intel macOS unit tests
        timeout-minutes: 150
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          ALSOFT_DRIVERS: "null"
        run: |
          suffix=""
          if [ "$CONFIGURATION" = debug ]; then suffix="-debug"; fi
          # Share the virtual GPU between one test process at a time.
          make "test/macosx-x86_64${suffix}" JOBS=4 CTEST_JOBS=1 CTEST_REPEAT='' LABEL_FILTER='' \
            CMAKE_EXTRA_ARGS="-DEVENGINE_THIRD_PARTY_MODE=PREBUILT -DEVENGINE_COMPILER_CACHE=OFF"

      - name: Upload Intel macOS build diagnostics
        if: failure()
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macosx-x86_64-${{ matrix.configuration }}-build-logs
          path: |
            build/macosx-x86_64*.log
            build/macosx-x86_64*/Testing/Temporary/
          if-no-files-found: ignore


  intel-loader:
    if: ${{ inputs.target == 'loader' }}
    env:
      MVK_CONFIG_VK_SEMAPHORE_SUPPORT_STYLE: '0'
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533
        with:
          vulkan_version: '1.4.363.0'
          cache: true
          destination: ${{ runner.temp }}/VulkanSDK
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: bash .github/scripts/resolve-vulkan-macos.sh "${{ runner.temp }}/VulkanSDK"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: EVEngine/third-party
          ref: e7e0a476be19a05839add497c29482c372f2c484
          path: probe-third-party
          sparse-checkout: |
            glm
            medialoader
            SDL2
            VKBuilder
            vulkan
            vk_video
            vma
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: assimp/assimp
          ref: c35200e38ea8f058812b83de2ef32c6093b0ece2
          path: probe-assimp
          sparse-checkout: include
      - name: Reproduce glTF frames through the existing Intel SDK
        env:
          GH_TOKEN: ${{ github.token }}
          EVENGINE_VULKAN_VALIDATION: '1'
          MVK_CONFIG_LOG_LEVEL: '4'
        run: |
          set -euo pipefail
          git -C probe-third-party submodule update --init --depth 1 medialoader SDL2 VKBuilder
          gh run download 41299927015 --repo github.com/EVEngine/EVEngine --name sdk-macosx-x86_64 --dir "$RUNNER_TEMP/sdk-download"
          unzip -q "$RUNNER_TEMP/sdk-download/eve-sdk-macosx-x86_64-v0.6.1.zip" -d "$RUNNER_TEMP/sdk"
          sdk="$RUNNER_TEMP/sdk/eve-sdk/macosx-x86_64"
          clang++ -std=c++20 -Wno-switch .github/diagnostics/pr701-followup/loader/main.cpp -Iprobe-third-party/VKBuilder/include -Iprobe-third-party -Iprobe-third-party/SDL2/include -L"$sdk/lib" -Wl,-rpath,"$sdk/lib" -lSDL2 "$VULKAN_SDK/lib/libvulkan.dylib" -o build-loader-probe
          otool -L build-loader-probe
          for mode in default keep sdl; do
            echo "=== loader mode $mode ==="
            ./build-loader-probe "$mode" 2>&1 || true
          done
          echo '=== explicit MoltenVK manifest control ==='
          export VK_ICD_FILENAMES="$VULKAN_SDK/share/vulkan/icd.d/MoltenVK_icd.json"
          ./build-loader-probe default 2>&1 || true
          echo '=== Metal argument buffers disabled control ==='
          MVK_CONFIG_USE_METAL_ARGUMENT_BUFFERS=0 ./build-loader-probe default 2>&1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr701-intel-loader
          path: |
            engine-probe*.log
            engine-probe-sample.txt

