# Continuous integration: build + test on every push/PR, plus a nightly run.
# Each platform runs as its own parallel job so mobile (android/ios) and host
# builds don't serialize on a single runner:
#   windows → win32 debug (+ unit tests)
#   android → android debug
#   macos   → macosx debug (+ unit tests)
#   ios     → ios debug
#   linux   → linux debug (+ unit tests)
#   webgpu  → webgpu (Emscripten/WASM) release
#
# iOS signing (optional repo secrets):
#   IOS_CERTIFICATE_P12_BASE64, IOS_CERTIFICATE_PASSWORD, IOS_DEVELOPMENT_TEAM
#   IOS_PROVISIONING_PROFILE_BASE64 (optional)
# Without them, iOS builds unsigned (compile-only; cannot install to a device).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly: Monday 00:00 CST ≈ Sunday 16:00 UTC
    - cron: "0 16 * * 0"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VULKAN_VERSION: "1.4.304.1"
  ANDROID_NDK_VERSION: "26.1.10909125"
  ANDROID_API: "34"

jobs:
  # Fast structural check: no build, no toolchain. Fails when a module gains an
  # #include that points up the dependency layering (see
  # docs/dev/模块编排与裁剪架构.md). The known back-edges are whitelisted in the
  # script and shrink as the capability registry lands.
  layering:
    name: Module layering
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check module dependency layering
        run: python3 scripts/module_depgraph.py --check

      - name: Report dependency graph
        if: always()
        run: python3 scripts/module_depgraph.py

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        shell: pwsh
        run: |
          choco install make ninja -y --no-progress
          echo "VS_GENERATOR=Visual Studio 17 2022" >> $env:GITHUB_ENV

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: ${{ env.VULKAN_VERSION }}
          install_runtime: true
          # Headless Windows runners have no GPU ICD; SwiftShader provides
          # VK_KHR_surface so SDL_WINDOW_VULKAN / unit tests can run.
          install_swiftshader: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup software Vulkan ICD (SwiftShader)
        run: bash .github/scripts/setup-software-vulkan.sh

      - name: Build win32 debug
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make build/win32-debug JOBS="${NUMBER_OF_PROCESSORS:-8}"

      - name: Run win32 unit tests
        # Headless runners have no WASAPI endpoint (0x80070490); OpenAL Soft null backend.
        env:
          ALSOFT_DRIVERS: "null"
        run: make test/win32-debug

  android:
    name: Android
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        shell: pwsh
        run: choco install make ninja -y --no-progress

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Install everything via the action so we don't rely on sdkmanager PATH
          # (Windows bash often cannot see cmdline-tools after setup-android alone).
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_API }}
            build-tools;${{ env.ANDROID_API }}.0.0
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Resolve Android SDK / NDK paths
        run: bash .github/scripts/setup-android-sdk.sh

      - name: Write Gradle local.properties
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > platform/android/apk/local.properties
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK=$ANDROID_NDK"
          test -f "$ANDROID_NDK/build/cmake/android.toolchain.cmake"

      - name: Build android debug
        run: |
          test -f "$ANDROID_NDK/build/cmake/android.toolchain.cmake"
          make build/android-debug \
            ANDROID_SDK="$ANDROID_SDK" \
            ANDROID_NDK="$ANDROID_NDK" \
            JAVA_HOME="$JAVA_HOME" \
            ANDROID_JOBS="${NUMBER_OF_PROCESSORS:-8}"

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tools
        run: brew install ninja || true

      - name: Install Vulkan SDK (MoltenVK + iOS)
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: ${{ env.VULKAN_VERSION }}
          cache: true
          destination: ${{ runner.temp }}/VulkanSDK
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve VULKAN_SDK
        run: bash .github/scripts/resolve-vulkan-macos.sh "${{ runner.temp }}/VulkanSDK"

      - name: Build macosx debug
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make build/macosx-debug JOBS="$(sysctl -n hw.ncpu)"

      - name: Run macosx unit tests
        # Headless runners have no stable audio device; the real CoreAudio
        # backend makes the ModPlug MIDI test flaky (segfault/mutex). Use the
        # OpenAL Soft null backend like the Windows/Linux jobs.
        env:
          ALSOFT_DRIVERS: "null"
        run: make test/macosx-debug

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tools
        run: brew install ninja || true

      - name: Install Vulkan SDK (MoltenVK + iOS)
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: ${{ env.VULKAN_VERSION }}
          cache: true
          destination: ${{ runner.temp }}/VulkanSDK
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve VULKAN_SDK
        run: bash .github/scripts/resolve-vulkan-macos.sh "${{ runner.temp }}/VulkanSDK"

      - name: Setup iOS signing (optional)
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: bash .github/scripts/setup-ios-signing.sh

      - name: Build ios debug
        run: |
          set -euo pipefail
          JOBS="$(sysctl -n hw.ncpu)"
          if [ "${IOS_SIGNING:-0}" = "1" ] && [ -n "${IOS_DEVELOPMENT_TEAM:-}" ]; then
            echo "Building signed iOS (team=$IOS_DEVELOPMENT_TEAM)"
            make build/ios-debug \
              IOS_DEVELOPMENT_TEAM="$IOS_DEVELOPMENT_TEAM" \
              ANDROID_JOBS="$JOBS"
          else
            echo "Building unsigned iOS"
            make build/ios-debug \
              IOS_DEVELOPMENT_TEAM= \
              ANDROID_JOBS="$JOBS"
          fi

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libx11-dev libxxf86vm-dev libxi-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev libxext-dev libxss-dev \
            libgl1-mesa-dev \
            libbz2-dev libpng-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev \
            mesa-vulkan-drivers vulkan-tools \
            xvfb

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: ${{ env.VULKAN_VERSION }}
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup software Vulkan ICD (Lavapipe)
        run: bash .github/scripts/setup-software-vulkan.sh

      - name: Build linux debug
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make build/linux-debug JOBS="$(nproc)"

      - name: Run linux unit tests
        # No ALSA card on runners; force OpenAL Soft null backend so audio tests still run.
        env:
          ALSOFT_DRIVERS: "null"
        run: |
          # Some graphics/window tests may need a display; xvfb covers headless runners.
          # VK_ICD_FILENAMES (Lavapipe) comes from setup-software-vulkan.sh.
          xvfb-run -a make test/linux-debug

  webgpu:
    name: WebGPU (WASM)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git ninja-build python3 python3-pip

      - name: Install CMake 3.29 (Emscripten is incompatible with CMake 4.x)
        run: |
          python3 -m pip install --user cmake==3.29.6
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest

      - name: Configure webgpu (Emscripten/WASM)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          source "$HOME/emsdk/emsdk_env.sh"
          emcmake cmake -B build/webgpu-web -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build webgpu (Emscripten/WASM)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          source "$HOME/emsdk/emsdk_env.sh"
          cmake --build build/webgpu-web --parallel "$(nproc)"

      - name: Verify webgpu artifacts
        run: |
          test -f build/webgpu-web/src/engine/eve.html
          test -f build/webgpu-web/src/engine/eve.wasm
          ls -lh build/webgpu-web/src/engine/eve.*
