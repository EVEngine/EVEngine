            ANDROID_NDK="$ANDROID_NDK" \
            JAVA_HOME="$JAVA_HOME" \
            CMAKE_EXTRA_ARGS="-DEVENGINE_COMPILER_CACHE=SCCACHE -DEVENGINE_ENABLE_ASSERTS=ON ${{ steps.third-party-cache.outputs.cmake-args }}" \
