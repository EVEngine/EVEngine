      - name: Upload settlement benchmark sample
        if: ${{ always() && steps.settlement-benchmark.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: settlement-benchmark-linux-release
          path: build/settlement-benchmark-linux.log
