  linux:
    name: Linux
    if: ${{ github.event_name != 'workflow_call' || inputs.build_type == 'debug' || inputs.build_type == 'both' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: evengine-cpp-v1-linux-x64
      # Populate shared caches only from long-lived branches; PR-scoped writes
      # are dead stores after that PR closes and quickly evict reusable entries.
      SCCACHE_GHA_RW_MODE: ${{ (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && 'READ_WRITE' || 'READ_ONLY' }}
      SCCACHE_DIRECT: "false"
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Install system packages
        timeout-minutes: 10
        run: |
          # GitHub-hosted ubuntu-24.04 images sometimes pin the retired
          # azure.archive.ubuntu.com mirror, which hangs instead of failing.
          # Normalize to the canonical mirror so apt has a reachable source.
          sudo sed -i -E 's#https?://[^/]*archive\.ubuntu\.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | \
            sudo tee /etc/apt/apt.conf.d/90eve-timeouts >/dev/null
          sudo pkill -f "unattended-upgrade" || true
          sudo systemctl stop apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          apt_ok=0
          for i in 1 2 3; do
            timeout 120 sudo apt-get update -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 && { apt_ok=1; break; }
            [ "$i" -lt 3 ] && sleep 20
          done
          [ "$apt_ok" -eq 1 ] || exit 1
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libx11-dev libxxf86vm-dev libxi-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev libxext-dev libxss-dev \
            libgl1-mesa-dev \
            libbz2-dev libpng-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev \
            mesa-vulkan-drivers vulkan-tools \
            xvfb

      - name: Setup C/C++ compilation cache
        timeout-minutes: 10
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Identify third-party toolchain
        id: third-party-toolchain
        timeout-minutes: 5
        run: |
          compiler_target="$(g++ -dumpmachine)"
          compiler_version="$(g++ -dumpfullversion -dumpversion)"
          cmake_version="$(cmake --version | head -n 1 | awk '{print $3}')"
          echo "id=gcc-$compiler_target-$compiler_version-cmake-$cmake_version" >> "$GITHUB_OUTPUT"

      - name: Restore linux third-party cache
        id: third-party-cache
        timeout-minutes: 15
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: build/third-party-binary/linux-debug
          key: third-party-v1-ubuntu-24.04-${{ runner.arch }}-linux-debug-${{ steps.third-party-toolchain.outputs.id }}-${{ hashFiles('cmake/third_party_pin.cmake', 'cmake/third_party_cache_version.txt', 'cmake/patch_third_party.cmake', 'cmake/patches/**', 'cmake/write_third_party_version.cmake') }}

      - name: Verify restored linux third-party cache
        if: steps.third-party-cache.outputs.cache-hit == 'true'
        timeout-minutes: 5
        run: bash .github/scripts/verify-third-party-cache.sh build/third-party-binary/linux-debug linux Release

      - name: Install Vulkan SDK
        timeout-minutes: 20
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1
        with:
          vulkan_version: ${{ env.VULKAN_VERSION }}
          cache: true
          cache_save_if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup software Vulkan ICD (Lavapipe)
        timeout-minutes: 5
        run: bash .github/scripts/setup-software-vulkan.sh

      - name: Build linux debug
        timeout-minutes: 40
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tp_args=""
          if [ "${{ steps.third-party-cache.outputs.cache-hit }}" = "true" ]; then
            tp_args="-DEVENGINE_THIRD_PARTY_BINARY_DIR=build/third-party-binary/linux-debug"
          fi
          make build/linux-debug JOBS="$(nproc)" \
            CMAKE_EXTRA_ARGS="-DEVENGINE_ENABLE_STRICT_WARNINGS=ON \
              -DEVENGINE_COMPILER_CACHE=SCCACHE $tp_args"

      - name: Report C/C++ compilation cache
        if: always()
        timeout-minutes: 5
        run: sccache --show-stats

      - name: Verify built linux third-party cache
        timeout-minutes: 5
        run: bash .github/scripts/verify-third-party-cache.sh build/third-party-binary/linux-debug linux Release

      - name: Save linux third-party cache
        if: >-
          steps.third-party-cache.outputs.cache-hit != 'true' &&
          (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        timeout-minutes: 15
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: build/third-party-binary/linux-debug
          key: ${{ steps.third-party-cache.outputs.cache-primary-key }}

      - name: Run linux unit tests
        timeout-minutes: 30
        env:
          ALSOFT_DRIVERS: "null"
        run: |
          # CTEST_JOBS=2: Lavapipe renders several window/GPU tests in
          # parallel; -j4 hits a pre-existing race (voxel.render.sceneHillsIsland
          # SEGFAULT) that is not reproducible in isolation.
          xvfb-run -a -s "-screen 0 1280x800x24" make test/linux-debug CTEST_JOBS=2

      - name: Run headless GPU tests without Xvfb
        timeout-minutes: 15
        env:
          ALSOFT_DRIVERS: "null"
          EVENGINE_VIEW_SECONDS: "0.3"
          EVENGINE_PERF_FRAMES: "30"
        run: |
          # The headless GPU suites must run without any display server,
          # proving the headless-vs-window policy in docs/dev/测试覆盖.md §0.
          # (These files never create an SDL window: canvas/device readback only.)
          ctest --test-dir build/linux-debug --output-on-failure -j 2 \
            -R '^bundle/(graphics_font|TextureSampler|gpgpu|tensor|virtualgeometry_gpu|graphics_headless)\.cpp$'

      - name: Smoke all examples (headless)
        timeout-minutes: 20
        env:
          ALSOFT_DRIVERS: "null"
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" bash scripts/smoke_examples.sh

      - name: DevLab developer-experience test (hot reload + DevTools)
        timeout-minutes: 5
        env:
          ALSOFT_DRIVERS: "null"
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" bash scripts/test_devlab.sh "$PWD/build/linux-debug/src/engine/eve"

