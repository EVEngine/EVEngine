          ALSOFT_DRIVERS: "null"
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" make test/linux-coverage CTEST_JOBS=2

      - name: Generate coverage report
        timeout-minutes: 10
        run: |
          gcovr -r . --object-directory build/linux-coverage \
            --exclude 'build/' --exclude 'external/' --exclude 'third-party/' --exclude 'test/' \
            --gcov-ignore-parse-errors \
            --gcov-ignore-errors=no_working_dir_found \
            -x build/linux-coverage/coverage.xml
          gcovr -r . --object-directory build/linux-coverage \
            --exclude 'build/' --exclude 'external/' --exclude 'third-party/' --exclude 'test/' \
            --gcov-ignore-parse-errors \
            --gcov-ignore-errors=no_working_dir_found \
            --html --html-details -o build/linux-coverage/coverage.html

      - name: Upload coverage artifact
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: linux-coverage
          path: |
            build/linux-coverage/coverage.xml
            build/linux-coverage/coverage.html

  linux-fuzz:
    name: Linux (zeroerr fuzz)
    needs: [source-quality, change-scope]
    if: ${{ needs.source-quality.result == 'success' && needs.change-scope.outputs.fuzz == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # zeroerr's structured custom mutator retains IRObject allocations for
      # the process lifetime. Keep ASan's UAF/OOB checks without treating that
      # upstream runner behavior as an engine leak.
      ASAN_OPTIONS: "detect_leaks=0:halt_on_error=1"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
      EVENGINE_FUZZ_RUNS: ${{ github.event_name == 'schedule' && '50000' || '2000' }}
      EVENGINE_FUZZ_SEED: "1"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: evengine-cpp-v1-linux-x64-fuzz
      SCCACHE_GHA_RW_MODE: ${{ (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && 'READ_WRITE' || 'READ_ONLY' }}
      SCCACHE_DIRECT: "false"
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Install fuzz toolchain
        timeout-minutes: 5
        run: |
          # Only Ubuntu indexes are needed for this toolchain.
          test -s /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=- -o Acquire::Retries=2
          sudo apt-get install -y --no-install-recommends clang ninja-build

      - name: Setup C/C++ compilation cache
        timeout-minutes: 10
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Build zeroerr JSON fuzz harness
        timeout-minutes: 5
        run: >-
          make build/linux-fuzz JOBS="$(nproc)"
          CMAKE_EXTRA_ARGS="-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"

      - name: Report C/C++ compilation cache
        if: always()
        timeout-minutes: 5
        run: sccache --show-stats

      - name: Fuzz shared JSON parser
        timeout-minutes: 5
        run: make fuzz/linux JOBS="$(nproc)"

      - name: Upload reproducer
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: json-fuzz-reproducer
          path: |
            build/linux-fuzz/crash-*
            build/linux-fuzz/leak-*
            build/linux-fuzz/oom-*
            build/linux-fuzz/timeout-*
          if-no-files-found: ignore

  webgpu:
    name: WebGPU (WASM)
    needs: [source-quality, change-scope]
    if: ${{ needs.source-quality.result == 'success' && needs.change-scope.outputs.webgpu == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EMSCRIPTEN_VERSION: "6.0.9"
      EMDAWNWEBGPU_RELEASE: "v20260423.175430"
    # Do not add sccache via EM_COMPILER_WRAPPER here: emsdk's Clang commands
    # carry -Xclang flags that sccache v0.16 treats as non-cacheable, adding
    # wrapper overhead without storing any of the engine's object files.
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Install system packages
        timeout-minutes: 10
        run: |
          # GitHub-hosted ubuntu-24.04 images sometimes pin the retired
          # azure.archive.ubuntu.com mirror, which hangs instead of failing.
          # Normalize to the canonical mirror so apt has a reachable source.
          sudo sed -i -E 's#https?://[^/]*archive\.ubuntu\.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | \
            sudo tee /etc/apt/apt.conf.d/90eve-timeouts >/dev/null
          sudo pkill -f "unattended-upgrade" || true
          sudo systemctl stop apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          # Only Ubuntu indexes are needed for this toolchain.
          test -s /etc/apt/sources.list.d/ubuntu.sources
          apt_ok=0
          for i in 1 2 3; do
            timeout 120 sudo apt-get update -o Acquire::Retries=2 \
              -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
              -o Dir::Etc::sourceparts=- \
              -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 && { apt_ok=1; break; }
            [ "$i" -lt 3 ] && sleep 20
          done
          [ "$apt_ok" -eq 1 ] || exit 1
          sudo apt-get install -y --no-install-recommends \
            git ninja-build python3 python3-pip

      - name: Install CMake 3.29 (Emscripten is incompatible with CMake 4.x)
        timeout-minutes: 10
        run: |
          python3 -m pip install --user cmake==3.29.6
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore Emscripten SDK cache
        id: emsdk-cache
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: $HOME/emsdk
          key: emsdk-${{ runner.os }}-${{ runner.arch }}-${{ env.EMSCRIPTEN_VERSION }}-${{ env.EMDAWNWEBGPU_RELEASE }}-v1

      - name: Install Emscripten SDK
        timeout-minutes: 30
        run: |
          if [ "${{ steps.emsdk-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Using cached Emscripten SDK"
          else
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          fi
          "$HOME/emsdk/emsdk" install "$EMSCRIPTEN_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSCRIPTEN_VERSION"

      - name: Acquire and verify immutable WebGPU port
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p artifacts/webgpu-dependencies
          archive="artifacts/webgpu-dependencies/emdawnwebgpu.zip"
          url="https://github.com/google/dawn/releases/download/${EMDAWNWEBGPU_RELEASE}/emdawnwebgpu_pkg-${EMDAWNWEBGPU_RELEASE}.zip"
          if ! curl --fail --location --retry 4 --retry-all-errors --retry-delay 5 \
            --output "$archive" "$url"; then
            python3 -c 'from pathlib import Path; from scripts.ci_result import CIResult, FailureKind; CIResult.failure(FailureKind.INFRASTRUCTURE, "WEBGPU_DEPENDENCY_DOWNLOAD_FAILED", "webgpu-dependencies", "failed to download the locked emdawnwebgpu archive after retries").write(Path("artifacts/webgpu-dependencies/ci-result.json"))'
            exit 1
          fi
          python3 scripts/verify_webgpu_dependencies.py \
            --lock cmake/webgpu_dependencies.json \
            --archive "$archive" \
            --emscripten-version "$EMSCRIPTEN_VERSION" \
            --result-json artifacts/webgpu-dependencies/ci-result.json

      - name: Prewarm Emscripten WebGPU port
        timeout-minutes: 10
        run: |
          set -euo pipefail
          source "$HOME/emsdk/emsdk_env.sh"
          for attempt in 1 2 3; do
            em++ --use-port=emdawnwebgpu -x c++ -c /dev/null \
              -o artifacts/webgpu-dependencies/port-probe.o && exit 0
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done
          exit 1

      - name: Upload WebGPU dependency result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webgpu-dependency-result
          path: artifacts/webgpu-dependencies/ci-result.json
          if-no-files-found: warn

      - name: Configure webgpu (Emscripten/WASM)
        timeout-minutes: 15
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          source "$HOME/emsdk/emsdk_env.sh"
          # Keep Release object compilation; avoid expensive -O3 Binaryen
          # optimization in this browser smoke lane. Asyncify still runs.
          emcmake cmake -B build/webgpu-web -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS_RELEASE=-O1

      - name: Build webgpu (Emscripten/WASM)
        timeout-minutes: 60
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          source "$HOME/emsdk/emsdk_env.sh"
          cmake --build build/webgpu-web --parallel "$(nproc)"

      - name: Verify webgpu artifacts
        timeout-minutes: 5
        run: |
          test -f build/webgpu-web/src/engine/eve.html
          test -f build/webgpu-web/src/engine/eve.wasm
          ls -lh build/webgpu-web/src/engine/eve.*

      - name: Capture browser WebGPU frame
        timeout-minutes: 10
        run: |
          python3 -m pip install --quiet pillow
          cd build/webgpu-web/src/engine
          python3 -m http.server 8090 >webgpu-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          google-chrome --headless=new --no-sandbox --disable-gpu-sandbox \
            --enable-unsafe-webgpu --enable-features=Vulkan \
            --use-vulkan=swiftshader --window-size=800,600 \
            --timeout=20000 --screenshot=webgpu-browser.png \
            http://127.0.0.1:8090/eve.html
          python3 "$GITHUB_WORKSPACE/scripts/validate_render_frame.py" webgpu-browser.png

      - name: Upload browser WebGPU frame
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webgpu-browser-frame
          path: |
            build/webgpu-web/src/engine/webgpu-browser.png
            build/webgpu-web/src/engine/webgpu-http.log
          if-no-files-found: warn

      - name: Save Emscripten SDK cache
        # Only refresh on the default branch so per-PR runs restore (free) but
        # never rewrite the cache, keeping churn/eviction of hot caches low.
        if: ${{ steps.emsdk-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/dev' }}
        timeout-minutes: 15
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: $HOME/emsdk
          key: ${{ steps.emsdk-cache.outputs.cache-primary-key }}
