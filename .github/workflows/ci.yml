# Continuous integration: daily Debug on the development branch (push/PR), plus a weekly run.
# Reusable via workflow_call (build_type: debug | release | both) for releases.
# Each platform runs as its own parallel job:
#   windows → win32 debug (+ unit tests); windows-release when asked
#   android → android debug; android-release when asked
#   macos   → macosx debug (+ unit tests); macos-release when asked
#   ios     → ios debug; ios-release when asked
#   linux   → linux debug (+ unit tests); linux-release when asked
#   webgpu  → webgpu (Emscripten/WASM) release
#
# iOS signing (optional repo secrets):
#   IOS_CERTIFICATE_P12_BASE64, IOS_CERTIFICATE_PASSWORD, IOS_DEVELOPMENT_TEAM
#   IOS_PROVISIONING_PROFILE_BASE64 (optional)
# Without them, iOS builds unsigned (compile-only; cannot install to a device).

name: CI

on:
  workflow_call:
    inputs:
      build_type:
        description: debug | release | both
        type: string
        default: debug
      ref:
        description: git ref to check out (release branch or moved tag)
        type: string
        default: ""
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  schedule:
    # Weekly: Monday 00:00 CST ≈ Sunday 16:00 UTC
    - cron: "0 16 * * 0"
  workflow_dispatch:
    inputs:
      build_type:
        description: debug | release | both
        type: choice
        default: debug
        options: [debug, release, both]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Single source of truth: repository variables (Settings -> Secrets and
  # variables -> Actions -> Variables), falling back to these defaults.
  VULKAN_VERSION: ${{ vars.VULKAN_VERSION || '1.4.304.1' }}
  # Aligned to the NDK preinstalled on the windows-latest / macos-latest runner
  # images (27.3.13750724), so setup-android downloads nothing extra.
  ANDROID_NDK_VERSION: ${{ vars.ANDROID_NDK_VERSION || '27.3.13750724' }}
  ANDROID_API: ${{ vars.ANDROID_API || '34' }}

jobs:
  # Fast structural check: no build, no toolchain. Fails when a module gains an
  # #include that points up the dependency layering (see
  # docs/dev/模块编排与裁剪架构.md). The known back-edges are whitelisted in the
  # script and shrink as the capability registry lands.
  format:
    name: Formatting (clang-format)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          sudo ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format

      - name: Check changed lines are clang-format clean
        run: bash .github/scripts/check-format.sh "${{ github.event.pull_request.base.sha || 'origin/dev' }}"

  # Fast structural check: no build, no toolchain. Fails when a module gains an
  # #include that points up the dependency layering (see
  # docs/dev/模块编排与裁剪架构.md). The known back-edges are whitelisted in the
  # script and shrink as the capability registry lands.
  layering:
    name: Module layering
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Check module dependency layering
        timeout-minutes: 5
        run: python3 scripts/module_depgraph.py --check

      - name: Check script bindings are documented (all modules)
        timeout-minutes: 5
        run: python3 scripts/check_bindings.py --strict

      - name: Check binding gap ownership and budget metadata
        timeout-minutes: 5
        run: python3 scripts/check_binding_gap_metadata.py

      - name: Check declared module layers vs includes
        timeout-minutes: 5
        run: python3 scripts/module_depgraph.py --check-layers

      - name: Report dependency graph
        timeout-minutes: 5
        if: always()
        run: python3 scripts/module_depgraph.py

      - name: Check test source manifest
        timeout-minutes: 5
        run: python3 scripts/check_test_manifest.py

      - name: Check critical return-value diagnostics
        timeout-minutes: 5
        run: python3 scripts/check_nodiscard.py

      - name: Test release.py
        timeout-minutes: 5
        run: python3 -m unittest discover -s scripts/tests -p "test_release*.py" -v

      - name: Check release version consistency
        timeout-minutes: 5
        run: python3 scripts/release.py check-versions

  quality-contracts:
    name: Quality metadata and profile contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Check bounded quality debt and profile matrix
        timeout-minutes: 5
        run: make check/quality

      - name: Run quality metadata fixture tests
        timeout-minutes: 5
        run: python3 -m unittest scripts.tests.test_quality_metadata -v

      - name: Audit top-level architecture contracts and changed API shapes
        timeout-minutes: 5
        run: |
          python3 scripts/check_architecture_contracts.py \
            --base "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}"
          python3 -m unittest scripts.tests.test_architecture_contracts -v

  profile-matrix:
    name: Profile ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [minimal, 2d, 3d, procgen-core-only, physics-core-only, headless, server]
    env:
      PROFILE: ${{ matrix.profile }}
      PROFILE_BUILD_ROOT: /tmp/evengine-profile-matrix
      PROFILE_JOBS: 2
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Install profile toolchain
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libvulkan-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxext-dev libxss-dev libwayland-dev libxkbcommon-dev

      - name: Configure profile
        timeout-minutes: 30
        run: make profile/configure

      - name: Build independent profile smoke target
        timeout-minutes: 35
        run: make profile/build

      - name: Run independent capability smoke probes
        timeout-minutes: 10
        run: make profile/smoke

  python-tools:
    name: Python tools
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python test dependencies
        timeout-minutes: 10
        run: |
          python3 -m pip install --user --quiet \
            pytest pydantic requests numpy opencv-python-headless pillow ffmpy ruff

      - name: Ruff lint (scripts + tools)
        timeout-minutes: 5
        run: python3 -m ruff check scripts tools

      - name: Test Python scripts
        timeout-minutes: 5
        run: python3 -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Test asset-pipeline-agent
        timeout-minutes: 5
        run: cd tools/asset-pipeline-agent && python3 -m unittest discover -s tests -v

      - name: Test scene-qc-agent
        timeout-minutes: 5
        run: cd tools/scene-qc-agent && python3 -m unittest discover -s tests -v

      - name: Test creative-brain
        timeout-minutes: 5
        run: cd tools/creative-brain && python3 -m pytest -q

      - name: Test normal-crafter (client)
        timeout-minutes: 5
        run: cd tools/normal-crafter && python3 -m pytest -q test

      - name: Test story-scene-agent
        timeout-minutes: 5
        run: PYTHONPATH=tools/creative-brain python3 -m pytest -q tools/story-scene-agent/tests

      - name: Test vision-prefilter
        timeout-minutes: 5
        run: cd tools/vision-prefilter && python3 -m pytest -q test

  windows:
    name: Windows
    if: ${{ github.event_name != 'workflow_call' || inputs.build_type == 'debug' || inputs.build_type == 'both' }}
    runs-on: windows-latest
    # This lane builds and tests both Vulkan and native Dawn configurations.
    # A cold Windows runner needs more than 90 minutes for the two independent
    # unit_test builds; keep the per-step limits below as the hang guards.
    timeout-minutes: 180
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: evengine-cpp-v1-windows-x64
      # Pull-request cache entries are scoped to refs/pull/*/merge and cannot
      # warm other PRs. Let PRs consume the dev cache without duplicating it.
      SCCACHE_GHA_RW_MODE: ${{ (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && 'READ_WRITE' || 'READ_ONLY' }}
      SCCACHE_DIRECT: "false"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Install build tools
        timeout-minutes: 15
        shell: pwsh
        run: |
          choco install make ninja -y --no-progress
          echo "VS_GENERATOR=Visual Studio 17 2022" >> $env:GITHUB_ENV

      - name: Setup C/C++ compilation cache
        timeout-minutes: 10
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Identify third-party toolchain
        id: third-party-toolchain
        timeout-minutes: 5
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $toolsetFile = Join-Path $vsRoot "VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt"
          $toolset = (Get-Content $toolsetFile -Raw).Trim()
          $sdkVersion = (& cmd.exe /d /s /c `
            'cmake\with-msvc.cmd cmd.exe /d /c echo %WindowsSDKVersion%').Trim().TrimEnd('\')
          $cmakeVersion = ((cmake --version | Select-Object -First 1) -split '\s+')[-1]
          "id=msvc-$toolset-winsdk-$sdkVersion-cmake-$cmakeVersion" >> $env:GITHUB_OUTPUT

      - name: Restore win32 third-party cache
        id: third-party-cache
        timeout-minutes: 15
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: build/third-party-binary/win32-debug
          key: third-party-v1-${{ runner.os }}-${{ runner.arch }}-win32-debug-${{ steps.third-party-toolchain.outputs.id }}-${{ hashFiles('cmake/third_party_pin.cmake', 'cmake/third_party_cache_version.txt', 'cmake/patch_third_party.cmake', 'cmake/patches/**', 'cmake/write_third_party_version.cmake') }}

      - name: Verify restored win32 third-party cache
        if: steps.third-party-cache.outputs.cache-hit == 'true'
        timeout-minutes: 5
        run: bash .github/scripts/verify-third-party-cache.sh build/third-party-binary/win32-debug win32 Debug

      - name: Install Vulkan SDK
        timeout-minutes: 20
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1
        with:
          vulkan_version: ${{ env.VULKAN_VERSION }}
          install_runtime: true
          # Headless Windows runners have no GPU ICD; SwiftShader provides
          # VK_KHR_surface so SDL_WINDOW_VULKAN / unit tests can run.
          install_swiftshader: true
          cache: true
          cache_save_if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup software Vulkan ICD (SwiftShader)
        timeout-minutes: 5
        run: bash .github/scripts/setup-software-vulkan.sh

      - name: Build win32 debug
        timeout-minutes: 40
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tp_args=""
          if [ "${{ steps.third-party-cache.outputs.cache-hit }}" = "true" ]; then
            tp_args="-DEVENGINE_THIRD_PARTY_BINARY_DIR=build/third-party-binary/win32-debug"
          fi
          make build/win32-debug JOBS="${NUMBER_OF_PROCESSORS:-8}" \
            CMAKE_EXTRA_ARGS="-DEVENGINE_ENABLE_STRICT_WARNINGS=ON \
              -DEVENGINE_COMPILER_CACHE=SCCACHE $tp_args"

      - name: Report C/C++ compilation cache
        if: always()
        timeout-minutes: 5
        run: sccache --show-stats

      - name: Verify built win32 third-party cache
        timeout-minutes: 5
        run: bash .github/scripts/verify-third-party-cache.sh build/third-party-binary/win32-debug win32 Debug

      - name: Save win32 third-party cache
        if: >-
          steps.third-party-cache.outputs.cache-hit != 'true' &&
          (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        timeout-minutes: 15
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: build/third-party-binary/win32-debug
          key: ${{ steps.third-party-cache.outputs.cache-primary-key }}

      - name: Run win32 unit tests
        timeout-minutes: 40
        # Headless runners have no WASAPI endpoint (0x80070490); OpenAL Soft null backend.
        env:
          ALSOFT_DRIVERS: "null"
        run: make test/win32-debug

      - name: Capture Vulkan parity artifacts
        timeout-minutes: 10
        env:
          ALSOFT_DRIVERS: "null"
          EVENGINE_RENDER_PARITY_DIR: ${{ github.workspace }}/artifacts/render-parity
        run: ctest --test-dir build/win32-debug -R '^graphics\.backendParity\.' --output-on-failure

      - name: Configure native Dawn parity lane
        timeout-minutes: 15
        shell: pwsh
        run: |
          cmake\with-msvc.cmd cmake.exe -S . -B build/webgpu-native -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DBUILD_PLATFORM=webgpu -DBUILD_TESTING=ON `
            -DEVENGINE_COMPILER_CACHE=SCCACHE `
            -DEVENGINE_THIRD_PARTY_BINARY_DIR="$PWD/build/third-party-binary/win32-debug" `
            -DEVENGINE_DOWNLOAD_SPINE_MODELS=OFF `
            -DEVENGINE_DOWNLOAD_SKINNED_CHARACTER=OFF

      - name: Build native Dawn parity lane
        timeout-minutes: 40
        shell: pwsh
        run: cmake\with-msvc.cmd cmake.exe --build build/webgpu-native --target unit_test -j 8

      - name: Report native Dawn compilation cache
        if: always()
        timeout-minutes: 5
        run: sccache --show-stats

      - name: Run native Dawn parity and PCG compute
        # Dawn initialization takes roughly two minutes per isolated test on
        # the Windows software adapter. Keep per-case process isolation while
        # allowing all parity cases plus the PCG compute parity case to complete.
        timeout-minutes: 40
        shell: pwsh
        env:
          ALSOFT_DRIVERS: "null"
          EVENGINE_RENDER_PARITY_DIR: ${{ github.workspace }}/artifacts/render-parity
        run: >-
          ctest --test-dir build/webgpu-native
          -R '^(graphics\.backendParity\..*|gpgpu\.procgen\.transformParity)$'
          --output-on-failure

      - name: Compare Vulkan and WebGPU parity images
        timeout-minutes: 5
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          python scripts/compare_render_backends.py `
            artifacts/render-parity/vulkan artifacts/render-parity/webgpu

      - name: Upload render parity artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: render-parity-windows
          path: artifacts/render-parity
          if-no-files-found: warn

  windows-release:
    name: Windows (Release)
    if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: evengine-cpp-v1-windows-x64-release
      SCCACHE_GHA_RW_MODE: ${{ (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && 'READ_WRITE' || 'READ_ONLY' }}
      SCCACHE_DIRECT: "false"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Install build tools
        timeout-minutes: 15
        shell: pwsh
        run: |
          choco install make ninja -y --no-progress
          echo "VS_GENERATOR=Visual Studio 17 2022" >> $env:GITHUB_ENV

      - name: Setup C/C++ compilation cache
        timeout-minutes: 10
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Vulkan SDK
        timeout-minutes: 20
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1
        with:
          vulkan_version: ${{ env.VULKAN_VERSION }}
          install_runtime: true
          install_swiftshader: true
          cache: true
          cache_save_if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup software Vulkan ICD (SwiftShader)
        timeout-minutes: 5
        run: bash .github/scripts/setup-software-vulkan.sh

      - name: Build win32 release
        timeout-minutes: 40
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          make build/win32 JOBS="${NUMBER_OF_PROCESSORS:-8}"
          CMAKE_EXTRA_ARGS="-DEVENGINE_COMPILER_CACHE=SCCACHE"

      - name: Report C/C++ compilation cache
        if: always()
        timeout-minutes: 5
        run: sccache --show-stats

      - name: Run win32 release unit tests
        timeout-minutes: 30
        env:
          ALSOFT_DRIVERS: "null"
        run: make test/win32

  android:
    name: Android
    if: ${{ github.event_name != 'workflow_call' || inputs.build_type == 'debug' || inputs.build_type == 'both' }}
    runs-on: windows-latest
    # A cold NDK build can consume almost the entire 45-minute build-step budget
    # before Gradle packages the finished native library. Keep the step timeout
    # below as the hang guard while leaving enough job budget for setup/cleanup.
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: evengine-cpp-v1-android-arm64-debug
      SCCACHE_GHA_RW_MODE: ${{ (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && 'READ_WRITE' || 'READ_ONLY' }}
      SCCACHE_DIRECT: "false"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Install build tools
        timeout-minutes: 15
        shell: pwsh
        run: choco install make ninja -y --no-progress

      - name: Setup C/C++ compilation cache
        timeout-minutes: 10
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Setup Java 17
        timeout-minutes: 10
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        timeout-minutes: 20
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_API }}
            build-tools;${{ env.ANDROID_API }}.0.0
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Resolve Android SDK / NDK paths
        timeout-minutes: 5
        run: bash .github/scripts/setup-android-sdk.sh

      - name: Write Gradle local.properties
        timeout-minutes: 5
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > platform/android/apk/local.properties
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK=$ANDROID_NDK"
          test -f "$ANDROID_NDK/build/cmake/android.toolchain.cmake"

      - name: Build android debug
        timeout-minutes: 60
        run: |
          test -f "$ANDROID_NDK/build/cmake/android.toolchain.cmake"
          make build/android-debug \
            ANDROID_SDK="$ANDROID_SDK" \
            ANDROID_NDK="$ANDROID_NDK" \
            JAVA_HOME="$JAVA_HOME" \
            CMAKE_EXTRA_ARGS="-DEVENGINE_COMPILER_CACHE=SCCACHE" \
            ANDROID_JOBS="${NUMBER_OF_PROCESSORS:-8}"

      - name: Report C/C++ compilation cache
        if: always()
        timeout-minutes: 5
        run: sccache --show-stats

  android-release:
    name: Android (Release)
    if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: evengine-cpp-v1-android-arm64-release
      SCCACHE_GHA_RW_MODE: ${{ (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && 'READ_WRITE' || 'READ_ONLY' }}
      SCCACHE_DIRECT: "false"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Install build tools
        timeout-minutes: 15
        shell: pwsh
        run: choco install make ninja -y --no-progress

      - name: Setup C/C++ compilation cache
        timeout-minutes: 10
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Setup Java 17
        timeout-minutes: 10
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        timeout-minutes: 20
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_API }}
            build-tools;${{ env.ANDROID_API }}.0.0
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Resolve Android SDK / NDK paths
        timeout-minutes: 5
        run: bash .github/scripts/setup-android-sdk.sh

      - name: Write Gradle local.properties
        timeout-minutes: 5
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > platform/android/apk/local.properties
          test -f "$ANDROID_NDK/build/cmake/android.toolchain.cmake"

      - name: Build android release
        timeout-minutes: 45
        run: |
          test -f "$ANDROID_NDK/build/cmake/android.toolchain.cmake"
          make build/android \
            ANDROID_SDK="$ANDROID_SDK" \
            ANDROID_NDK="$ANDROID_NDK" \
            JAVA_HOME="$JAVA_HOME" \
