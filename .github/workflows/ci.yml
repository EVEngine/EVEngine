name: PR701 isolated Vulkan probe
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533
        with:
          vulkan_version: '1.4.363.0'
          cache: true
          destination: ${{ runner.temp }}/VulkanSDK
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Probe independent Vulkan paths
        env:
          MVK_CONFIG_USE_METAL_ARGUMENT_BUFFERS: '0'
          MVK_CONFIG_DEBUG: '0'
          MVK_CONFIG_LOG_LEVEL: '4'
        run: |
          set -euo pipefail
          export PATH="$VULKAN_SDK/bin:$PATH"
          export VK_ICD_FILENAMES="$VULKAN_SDK/share/vulkan/icd.d/MoltenVK_icd.json"
          bash .github/diagnostics/pr701/run.sh 2>&1 | tee probe.log
      - name: Fetch pinned diagnostic header dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: EVEngine/third-party
          ref: e7e0a476be19a05839add497c29482c372f2c484
          path: probe-third-party
          sparse-checkout: |
            glm
            medialoader
            VKBuilder
            vulkan
            vma
      - name: Reproduce through the existing native SDK
        env:
          GH_TOKEN: ${{ github.token }}
          EVENGINE_VULKAN_VALIDATION: '1'
          MVK_CONFIG_DEBUG: '0'
          MVK_CONFIG_LOG_LEVEL: '4'
        run: |
          set -euo pipefail
          git -C probe-third-party submodule update --init --depth 1 medialoader VKBuilder
          gh run download 41285557254 --repo github.com/EVEngine/EVEngine --name sdk-macosx-arm64 --dir "$RUNNER_TEMP/probe-sdk-download"
          unzip -q "$RUNNER_TEMP/probe-sdk-download/eve-sdk-macosx-arm64-v0.6.1.zip" -d "$RUNNER_TEMP/probe-sdk"
          sdk="$RUNNER_TEMP/probe-sdk/eve-sdk/macosx-arm64"
          cmake -S .github/diagnostics/pr701/sdk-plugin -B build/probe-plugin -DEVEngine_DIR="$sdk/cmake" -DPROBE_TP_DIR="$GITHUB_WORKSPACE/probe-third-party" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/probe-plugin --parallel 2
          cp build/probe-plugin/pr701_probe.dylib .github/diagnostics/pr701/sdk-game/
          cp .github/diagnostics/pr701/*.spv .github/diagnostics/pr701/sdk-game/
          python3 .github/diagnostics/pr701/run_sdk.py "$sdk/bin/eve"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr701-vulkan-probe
          path: |
            probe.log
            engine-probe.log
            engine-probe-sample.txt
            .github/diagnostics/pr701/sdk-game/*.ppm
            .github/diagnostics/pr701/*.ppm
