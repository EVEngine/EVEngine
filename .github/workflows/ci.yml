  linux:
    name: Linux
    needs: [source-quality, change-scope]
    if: ${{ needs.source-quality.result == 'success' && needs.change-scope.outputs.linux == 'true' && (github.event_name != 'workflow_call' || inputs.build_type == 'debug' || inputs.build_type == 'both') }}
    runs-on: ubuntu-24.04
    # Full debug build + per-case unit tests + all-example smoke exceeded the
    # previous 60-minute job cap even though each step stayed within its guard.
    # Cold third-party restore + read-only sccache (PR) can push the build step
    # past 40 minutes, so keep headroom for tests afterward.
    timeout-minutes: 120
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: evengine-cpp-v1-linux-x64
      # Populate shared caches only from long-lived branches; PR-scoped writes
      # are dead stores after that PR closes and quickly evict reusable entries.
      SCCACHE_GHA_RW_MODE: ${{ (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/v') || startsWith(inputs.ref, 'v')) && 'READ_WRITE' || 'READ_ONLY' }}
      SCCACHE_DIRECT: "false"
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Install system packages
        # apt update may consume most of ten minutes while retrying a slow
        # mirror, and Mesa can download at well below 100 KiB/s. Keep enough
        # time for an active transfer to finish.
        timeout-minutes: 25
        run: |
          # GitHub-hosted ubuntu-24.04 images sometimes pin the retired
          # azure.archive.ubuntu.com mirror, which hangs instead of failing.
          # Normalize to the canonical mirror so apt has a reachable source.
          sudo sed -i -E 's#https?://[^/]*archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | \
            sudo tee /etc/apt/apt.conf.d/90eve-timeouts >/dev/null
          sudo pkill -f "unattended-upgrade" || true
          sudo systemctl stop apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          # Only Ubuntu indexes are needed for this toolchain.
          test -s /etc/apt/sources.list.d/ubuntu.sources
          apt_ok=0
          for i in 1 2 3; do
            timeout 120 sudo apt-get update -o Acquire::Retries=2 \
              -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
              -o Dir::Etc::sourceparts=- \
              -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 && { apt_ok=1; break; }
            [ "$i" -lt 3 ] && sleep 20
          done
          [ "$apt_ok" -eq 1 ] || exit 1
          # Package downloads can exceed the old ten-minute step budget.
          # Keep bounded transport retries and signature/hash verification.
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libx11-dev libxxf86vm-dev libxi-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev libxext-dev libxss-dev \
            libgl1-mesa-dev \
            libbz2-dev libpng-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev \
            mesa-vulkan-drivers vulkan-tools \
            xvfb ffmpeg python3-pil

      - name: Setup C/C++ compilation cache
        timeout-minutes: 10
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Vulkan SDK
        timeout-minutes: 20
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1
        with:
          vulkan_version: ${{ env.VULKAN_VERSION }}
          cache: true
          cache_save_if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup software Vulkan ICD (Lavapipe)
        timeout-minutes: 5
        run: bash .github/scripts/setup-software-vulkan.sh

      - name: Identify third-party toolchain
        id: third-party-toolchain
        timeout-minutes: 5
        run: bash .github/scripts/identify-third-party-toolchain.sh linux >> "$GITHUB_OUTPUT"

      - name: Restore verified third-party cache
        id: third-party-cache
        timeout-minutes: 20
        uses: ./.github/actions/restore-third-party
        with:
          platform: linux
          configuration: Debug
          toolchain: ${{ steps.third-party-toolchain.outputs.id }}

      - name: Build linux debug
        # PR compilation caches are read-only. Keep the budget for a full engine
        # rebuild; dependency libraries are downloaded from their own release.
        timeout-minutes: 60
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make build/linux-debug JOBS="$(nproc)" \
            CMAKE_EXTRA_ARGS="-DEVENGINE_ENABLE_STRICT_WARNINGS=ON \
              -DEVENGINE_COMPILER_CACHE=SCCACHE ${{ steps.third-party-cache.outputs.cmake-args }}"

      - name: Verify built third-party cache
        timeout-minutes: 5
        run: bash .github/scripts/verify-third-party-cache.sh "${{ steps.third-party-cache.outputs.prefix }}" linux Release build/linux-debug/CMakeCache.txt

      - name: Save third-party cache
        if: >-
          steps.third-party-cache.outputs.cache-hit != 'true' &&
          (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' ||
           startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/v') || startsWith(inputs.ref, 'v'))
        timeout-minutes: 15
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.third-party-cache.outputs.path }}
          key: ${{ steps.third-party-cache.outputs.key }}

      - name: Report C/C++ compilation cache
        if: always()
        timeout-minutes: 5
        run: sccache --show-stats

      - name: Verify resource format fixture integrity
        timeout-minutes: 5
        run: python3 scripts/resource_format_suite.py --report build/resource-format-inventory.json

      - name: Run linux unit tests
        # Run 39399072292 passed 6628/7045 cases before the 30-minute
        # guard fired. Keep headroom for the expanded suite and runner variance.
        timeout-minutes: 45
        env:
          ALSOFT_DRIVERS: "null"
          EVENGINE_FORMAT_EXPORT_DIR: "${{ github.workspace }}/build/resource-format-exports"
        run: |
          # CTEST_JOBS=2: Lavapipe renders several window/GPU tests in
          # parallel; -j4 hits a pre-existing race (voxel.render.sceneHillsIsland
          # SEGFAULT) that is not reproducible in isolation.
          xvfb-run -a -s "-screen 0 1280x800x24" make test/linux-debug CTEST_JOBS=2 \
            LABEL_FILTER='${{ needs.change-scope.outputs.test_label_regex }}'

      - name: Upload Linux test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-test-failure-logs
          path: |
            build/linux-debug/Testing/Temporary/LastTestsFailed.log
            build/linux-debug/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify resource test results without skipped or warning-only cases
        timeout-minutes: 20
        env:
          ALSOFT_DRIVERS: "null"
          EVENGINE_FORMAT_EXPORT_DIR: "${{ github.workspace }}/build/resource-format-exports"
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" python3 scripts/resource_format_suite.py \
            --build-dir build/linux-debug --report build/resource-format-report.json

      - name: Independently decode resource image exports
        timeout-minutes: 5
        run: |
          /usr/bin/python3 scripts/check_resource_format_exports.py build/resource-format-exports \
            --report build/resource-format-export-report.json

      - name: Run headless GPU tests without Xvfb
        timeout-minutes: 15
        env:
          ALSOFT_DRIVERS: "null"
          EVENGINE_VIEW_SECONDS: "0.3"
          EVENGINE_PERF_FRAMES: "30"
        run: |
          # The headless GPU suites must run without any display server,
          # proving the headless-vs-window policy in docs/dev/测试覆盖.md §0.
          # (These files never create an SDL window: canvas/device readback only.)
          ctest --test-dir build/linux-debug --output-on-failure -j 2 \
            -R '^bundle/(graphics_font|TextureSampler|gpgpu|tensor|virtualgeometry_gpu|graphics_headless)\.cpp$'

      # 150 headless Lavapipe smokes have finished green then still hit the old
      # 20-minute step guard during teardown (PR #586 run 38844868063;
      # run 38775560674). Keep headroom above the ~15+ minute live window.
      - name: Smoke all examples (headless, >=2s alive each)
        # 151 examples take up to 151 * (6s run + 3s termination grace),
        # already over 22 minutes before process/display setup overhead.
        timeout-minutes: 30
        env:
          ALSOFT_DRIVERS: "null"
          # Contract for examples/README.md "示例规范": every runnable example
          # must still be running MIN_RUN_SECONDS after launch, with no error
          # markers in its log; dying early or exiting non-zero fails the job.
          MIN_RUN_SECONDS: "2"
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" bash scripts/smoke_examples.sh

      - name: DevLab developer-experience test (hot reload + DevTools)
        timeout-minutes: 5
        env:
          ALSOFT_DRIVERS: "null"
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" bash scripts/test_devlab.sh "$PWD/build/linux-debug/src/engine/eve"

  linux-release:
    name: Linux (Release)
    needs: [source-quality, change-scope]
    if: ${{ needs.source-quality.result == 'success' && needs.change-scope.outputs.linux == 'true' && (inputs.build_type == 'release' || inputs.build_type == 'both') }}
    runs-on: ubuntu-24.04
    # The 75-minute build and 30-minute test guards must both fit inside the
    # job budget, together with checkout and toolchain setup.
    timeout-minutes: 150
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: evengine-cpp-v1-linux-x64-release
      SCCACHE_GHA_RW_MODE: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/v') || startsWith(inputs.ref, 'v')) && 'READ_WRITE' || 'READ_ONLY' }}
      SCCACHE_DIRECT: "false"
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Install system packages
        # Keep parity with the debug lane's full native dependency install.
        timeout-minutes: 15
        run: |
          # GitHub-hosted ubuntu-24.04 images sometimes pin the retired
          # azure.archive.ubuntu.com mirror, which hangs instead of failing.
          # Normalize to the canonical mirror so apt has a reachable source.
          sudo sed -i -E 's#https?://[^/]*archive\.ubuntu\.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | \
            sudo tee /etc/apt/apt.conf.d/90eve-timeouts >/dev/null
          sudo pkill -f "unattended-upgrade" || true
          sudo systemctl stop apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          # Only Ubuntu indexes are needed for this toolchain.
          test -s /etc/apt/sources.list.d/ubuntu.sources
          apt_ok=0
          for i in 1 2 3; do
            timeout 120 sudo apt-get update -o Acquire::Retries=2 \
              -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
              -o Dir::Etc::sourceparts=- \
              -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 && { apt_ok=1; break; }
            [ "$i" -lt 3 ] && sleep 20
          done
          [ "$apt_ok" -eq 1 ] || exit 1
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libx11-dev libxxf86vm-dev libxi-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev libxext-dev libxss-dev \
            libgl1-mesa-dev \
            libbz2-dev libpng-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev \
            mesa-vulkan-drivers vulkan-tools \
            xvfb

      - name: Setup C/C++ compilation cache
        timeout-minutes: 10
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Vulkan SDK
        timeout-minutes: 20
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1
        with:
          vulkan_version: ${{ env.VULKAN_VERSION }}
          cache: true
          cache_save_if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup software Vulkan ICD (Lavapipe)
        timeout-minutes: 5
        run: bash .github/scripts/setup-software-vulkan.sh

      - name: Identify third-party toolchain
        id: third-party-toolchain
        timeout-minutes: 5
        run: bash .github/scripts/identify-third-party-toolchain.sh linux >> "$GITHUB_OUTPUT"

      - name: Restore verified third-party cache
        id: third-party-cache
        timeout-minutes: 20
        uses: ./.github/actions/restore-third-party
        with:
          platform: linux
          configuration: Release
          toolchain: ${{ steps.third-party-toolchain.outputs.id }}

      - name: Build linux release
        # The v0.6.0 cold build reached 93% at 75 minutes; allow the remaining
        # compilation and links to finish while retaining a bounded hang guard.
        timeout-minutes: 105
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          make build/linux JOBS="$(nproc)"
          CMAKE_EXTRA_ARGS="-DEVENGINE_COMPILER_CACHE=SCCACHE -DEVENGINE_ENABLE_ASSERTS=ON ${{ steps.third-party-cache.outputs.cmake-args }}"

      - name: Verify built third-party cache
        timeout-minutes: 5
        run: bash .github/scripts/verify-third-party-cache.sh "${{ steps.third-party-cache.outputs.prefix }}" linux Release build/linux/CMakeCache.txt

      - name: Save third-party cache
        if: >-
          steps.third-party-cache.outputs.cache-hit != 'true' &&
          (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' ||
           startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/v') || startsWith(inputs.ref, 'v'))
        timeout-minutes: 15
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.third-party-cache.outputs.path }}
          key: ${{ steps.third-party-cache.outputs.key }}

      - name: Report C/C++ compilation cache
        if: always()
        timeout-minutes: 5
        run: sccache --show-stats

      - name: Run linux release unit tests
        timeout-minutes: 30
        env:
          ALSOFT_DRIVERS: "null"
        run: xvfb-run -a -s "-screen 0 1280x800x24" make test/linux

      - name: Sample settlement release benchmark
        id: settlement-benchmark
        timeout-minutes: 5
        env:
          ALSOFT_DRIVERS: "null"
          EVENGINE_SETTLEMENT_BENCHMARK: "1"
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build/linux \
            -R '^settlement\.benchmark\.' -V \
