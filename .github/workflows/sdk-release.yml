# Build target-platform SDKs and attach eve-sdk-<plat>-<tag>.zip to a Release.
# Formal promote (unmark prerelease) is scripts/release.py finish, not this file.
# Each SDK runs as its own parallel job (same split as ci.yml):
#   windows → win32 SDK (+ usability test)
#   android → android SDK
#   macos   → macosx-arm64 / macosx-x86_64 SDKs (+ usability tests)
#   ios     → ios SDK
#   linux   → linux SDK (+ usability test)
#   arm64   → native win32-arm64 / linux-arm64 SDKs (+ consumer tests)
#   webgpu  → browser SDK (+ extracted-archive startup and canvas tests)
#
# Called from release.yml after strict tests, or via workflow_dispatch + tag.
#
# iOS signing (optional repo secrets):
#   IOS_CERTIFICATE_P12_BASE64, IOS_CERTIFICATE_PASSWORD, IOS_DEVELOPMENT_TEAM
#   IOS_PROVISIONING_PROFILE_BASE64 (optional)
# Without them, iOS SDK builds unsigned (consumers re-sign locally).

name: SDK Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      ref:
        description: commit/branch to build (official vX.X.X after start)
        type: string
        default: ""
      publish:
        description: Attach to GitHub Release; false runs identical consumers against Actions artifacts
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload SDKs for
        required: true
        type: string
      publish:
        description: Upload to GitHub Release (disable for artifact-only verification)
        type: boolean
        default: true

permissions:
  contents: write

env:
  # Reuse the pinned dependency release; build source only if transfer is unavailable.
  CMAKE_EXTRA_ARGS: -DBUILD_TESTING=OFF -DEVENGINE_THIRD_PARTY_MODE=AUTO
  ALSOFT_DRIVERS: "null"
  # Single source of truth: repository variables (Settings -> Secrets and
  # variables -> Actions -> Variables), falling back to these defaults.
  VULKAN_VERSION: ${{ vars.VULKAN_VERSION || '1.4.304.1' }}
  # Aligned to the NDK preinstalled on the windows-latest / macos-latest runner
  # images (27.3.13750724), so setup-android downloads nothing extra.
  ANDROID_NDK_VERSION: ${{ vars.ANDROID_NDK_VERSION || '27.3.13750724' }}
  ANDROID_API: ${{ vars.ANDROID_API || '34' }}

jobs:
  webgpu:
    name: WebGPU Release SDK
    uses: ./.github/workflows/webgpu-sdk.yml
    with:
      ref: ${{ inputs.ref || inputs.tag }}
      tag: ${{ inputs.tag }}
    secrets: inherit

  windows:
    name: Windows SDK
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.tag }}
          submodules: recursive

      - name: Install build tools
        timeout-minutes: 15
        shell: pwsh
        run: |
          choco install make ninja -y --no-progress
          # Prefer VS 2022 on GitHub-hosted runners (local Makefile default is VS 2026).
          echo "VS_GENERATOR=Visual Studio 17 2022" >> $env:GITHUB_ENV

      - name: Install Vulkan SDK
        timeout-minutes: 20
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1
        with:
          vulkan_version: ${{ env.VULKAN_VERSION }}
          install_runtime: true
          cache: true
          # Release refs are one-shot cache scopes. Restore a long-lived cache
          # when available, but do not create a copy that no later run can use.
          cache_save_if: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup software Vulkan (SwiftShader, best-effort)
        timeout-minutes: 5
        run: |
          bash .github/scripts/setup-software-vulkan.sh || echo "WARN: software Vulkan unavailable; in-memory run skipped"

      - name: Build win32 SDK
        # Release run 38296135959 reached 1784/1900 edges at 90 minutes.
        timeout-minutes: 130
        run: make sdk/win32 VS_GENERATOR="$VS_GENERATOR" CMAKE_EXTRA_ARGS="$CMAKE_EXTRA_ARGS" JOBS="${NUMBER_OF_PROCESSORS:-8}"

      - name: Test win32 SDK usability
        timeout-minutes: 30
        env:
          TAG: ${{ inputs.tag }}
        run: bash .github/scripts/test-sdk.sh dist/eve-sdk/win32 win32 "${TAG#v}"

      - name: Package SDK zip
        timeout-minutes: 10
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p artifacts
          python .github/scripts/zip-sdk.py win32 "$TAG"
          ls -lh artifacts/

      - name: Upload artifacts
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-win32
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android SDK
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.tag }}
          submodules: recursive

      - name: Install build tools
        timeout-minutes: 15
        shell: pwsh
        run: choco install make ninja -y --no-progress

      - name: Setup Java
        timeout-minutes: 10
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        timeout-minutes: 20
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_API }}
            build-tools;${{ env.ANDROID_API }}.0.0
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Resolve Android SDK / NDK paths
        timeout-minutes: 5
        run: bash .github/scripts/setup-android-sdk.sh

      - name: Write Gradle local.properties
        timeout-minutes: 5
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > platform/android/apk/local.properties
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK=$ANDROID_NDK"
          test -f "$ANDROID_NDK/build/cmake/android.toolchain.cmake"

      - name: Build android SDK
        timeout-minutes: 90
        run: |
          test -f "$ANDROID_NDK/build/cmake/android.toolchain.cmake"
          make sdk/android \
            ANDROID_SDK="$ANDROID_SDK" \
            ANDROID_NDK="$ANDROID_NDK" \
            JAVA_HOME="$JAVA_HOME" \
            CMAKE_EXTRA_ARGS="$CMAKE_EXTRA_ARGS" \
            ANDROID_JOBS="${NUMBER_OF_PROCESSORS:-8}"

      - name: Test android SDK usability (assemble APK)
        timeout-minutes: 30
        env:
          TAG: ${{ inputs.tag }}
        run: bash .github/scripts/test-sdk.sh dist/eve-sdk/android android "${TAG#v}"

      - name: Package SDK zip
        timeout-minutes: 10
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p artifacts
          python .github/scripts/zip-sdk.py android "$TAG"
          ls -lh artifacts/

      - name: Upload artifacts
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-android
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.architecture }} SDK
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-latest
          - architecture: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      SDK_TARGET: macosx-${{ matrix.architecture }}
      SDK_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - name: Verify native macOS architecture
        timeout-minutes: 5
        run: test "$(uname -m)" = "$SDK_ARCHITECTURE"

      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.tag }}
          submodules: recursive

      - name: Install tools
        timeout-minutes: 10
        run: |
          brew install ninja || true
          # CMake on macos runners is usually recent enough; ensure ≥ 3.21.
          cmake --version

      - name: Install Vulkan SDK (MoltenVK)
        timeout-minutes: 20
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1
        with:
          vulkan_version: ${{ env.VULKAN_VERSION }}
          # Keep full macOS tree so MoltenVK remains available.
          cache: true
          cache_save_if: false
          destination: ${{ runner.temp }}/VulkanSDK
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve VULKAN_SDK / MoltenVK
        timeout-minutes: 5
        run: bash .github/scripts/resolve-vulkan-macos.sh "${{ runner.temp }}/VulkanSDK"

      - name: Build macosx SDK
        timeout-minutes: 90
        run: make "sdk/$SDK_TARGET" CMAKE_EXTRA_ARGS="$CMAKE_EXTRA_ARGS" JOBS=4

      - name: Test macosx SDK usability
        timeout-minutes: 30
        env:
          TAG: ${{ inputs.tag }}
          EVENGINE_VULKAN_VALIDATION: ${{ matrix.architecture == 'x86_64' && '1' || '0' }}
        run: bash .github/scripts/test-sdk.sh "dist/eve-sdk/$SDK_TARGET" macosx "${TAG#v}" "$SDK_ARCHITECTURE"

      - name: Package SDK zip
        timeout-minutes: 10
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p artifacts
          python3 .github/scripts/zip-sdk.py "$SDK_TARGET" "$TAG"
          ls -lh artifacts/

      - name: Upload artifacts
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-macosx-${{ matrix.architecture }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS SDK
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.tag }}
          submodules: recursive

      - name: Install tools
        timeout-minutes: 10
        run: |
          brew install ninja || true
          cmake --version

      - name: Install Vulkan SDK (MoltenVK + iOS)
        timeout-minutes: 20
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1
        with:
          vulkan_version: ${{ env.VULKAN_VERSION }}
          # Keep full macOS tree so MoltenVK / iOS xcframework remain available.
          cache: true
          cache_save_if: false
          destination: ${{ runner.temp }}/VulkanSDK
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve VULKAN_SDK / MoltenVK for iOS
        timeout-minutes: 5
        run: bash .github/scripts/resolve-vulkan-macos.sh "${{ runner.temp }}/VulkanSDK"

      - name: Setup iOS signing (optional)
        timeout-minutes: 5
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: bash .github/scripts/setup-ios-signing.sh

      - name: Build ios SDK
        timeout-minutes: 90
        run: |
          set -euo pipefail
          JOBS="$(sysctl -n hw.ncpu)"
          if [ "${IOS_SIGNING:-0}" = "1" ] && [ -n "${IOS_DEVELOPMENT_TEAM:-}" ]; then
            echo "Building signed iOS SDK (team=$IOS_DEVELOPMENT_TEAM)"
            make sdk/ios \
              IOS_DEVELOPMENT_TEAM="$IOS_DEVELOPMENT_TEAM" \
              CMAKE_EXTRA_ARGS="$CMAKE_EXTRA_ARGS" \
              ANDROID_JOBS="$JOBS"
          else
            echo "Building unsigned iOS SDK (consumers re-sign locally)"
            make sdk/ios \
              IOS_DEVELOPMENT_TEAM= \
              CMAKE_EXTRA_ARGS="$CMAKE_EXTRA_ARGS" \
              ANDROID_JOBS="$JOBS"
          fi

      - name: Test ios SDK artifact usability
        timeout-minutes: 10
        env:
          TAG: ${{ inputs.tag }}
        run: bash .github/scripts/test-sdk.sh dist/eve-sdk/ios ios "${TAG#v}"

      - name: Package SDK zip
        timeout-minutes: 10
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p artifacts
          python3 .github/scripts/zip-sdk.py ios "$TAG"
          ls -lh artifacts/

      - name: Upload artifacts
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-ios
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.tag }}
          submodules: recursive

      - name: Install system packages
        timeout-minutes: 10
        run: |
          # GitHub-hosted ubuntu-24.04 images sometimes pin the retired
          # azure.archive.ubuntu.com mirror, which hangs instead of failing.
          # Normalize to the canonical mirror so apt has a reachable source.
          sudo sed -i -E 's#https?://[^/]*archive\.ubuntu\.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | \
            sudo tee /etc/apt/apt.conf.d/90eve-timeouts >/dev/null
          sudo pkill -f "unattended-upgrade" || true
          sudo systemctl stop apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          apt_ok=0
          for i in 1 2 3; do
            timeout 120 sudo apt-get update -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 && { apt_ok=1; break; }
            [ "$i" -lt 3 ] && sleep 20
          done
          [ "$apt_ok" -eq 1 ] || exit 1
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build zip \
            libx11-dev libxxf86vm-dev libxi-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev libxext-dev libxss-dev \
            libgl1-mesa-dev \
            libbz2-dev libpng-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev \
            mesa-vulkan-drivers vulkan-tools \
            xvfb

      - name: Install Vulkan SDK
        timeout-minutes: 20
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1
        with:
          vulkan_version: ${{ env.VULKAN_VERSION }}
          cache: true
          cache_save_if: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup software Vulkan ICD (Lavapipe, best-effort)
        timeout-minutes: 5
        run: |
          bash .github/scripts/setup-software-vulkan.sh || echo "WARN: software Vulkan unavailable; in-memory run skipped"

      - name: Build linux SDK
        timeout-minutes: 90
        run: make sdk/linux CMAKE_EXTRA_ARGS="$CMAKE_EXTRA_ARGS" JOBS="$(nproc)"

      - name: Test linux SDK usability
        timeout-minutes: 30
        env:
          TAG: ${{ inputs.tag }}
        run: xvfb-run -a bash .github/scripts/test-sdk.sh dist/eve-sdk/linux linux "${TAG#v}"

      - name: Package SDK zip
        timeout-minutes: 10
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p artifacts
          python3 .github/scripts/zip-sdk.py linux "$TAG"
          ls -lh artifacts/

      - name: Upload artifacts
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-linux
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

  arm64:
    name: Native ARM64 SDKs
    uses: ./.github/workflows/arm64-sdk.yml
    with:
      tag: ${{ inputs.tag }}
      ref: ${{ inputs.ref }}
    secrets: inherit

  publish:
    name: Attach SDKs
    needs: [windows, android, macos, ios, linux, arm64, webgpu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release validators
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.tag }}

      - name: Download all SDK artifacts
        timeout-minutes: 10
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sdk-*
          path: artifacts
          merge-multiple: true

      - name: List packages
        timeout-minutes: 5
        run: ls -lh artifacts/

      - name: Generate SHA256SUMS
        timeout-minutes: 5
        run: |
          python3 - <<'PYEOF'
          import hashlib
          import pathlib

          files = sorted(pathlib.Path("artifacts").glob("eve-sdk-*.zip"))
          if not files:
              raise SystemExit("no eve-sdk-*.zip found under artifacts/")
          with open("artifacts/SHA256SUMS", "w", encoding="utf-8") as fh:
              for path in files:
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  fh.write(f"{digest}  {path.name}\n")
          print(open("artifacts/SHA256SUMS", encoding="utf-8").read())
          PYEOF

      - name: Attest build provenance (best-effort)
        if: inputs.publish
        timeout-minutes: 10
        # Requires the repository's artifact attestations setting; non-blocking
        # until the maintainer enables it. Attestations bind to the zips by
        # digest, so they survive the GitHub Release upload.
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/eve-sdk-*.zip

      - name: Verify complete SDK release set
        timeout-minutes: 5
        env:
          TAG: ${{ inputs.tag }}
        run: python3 scripts/verify_sdk_release.py artifacts "$TAG"

      - name: Save complete SDK set for preview consumers
        if: inputs.publish == false
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sdk-set
          path: |
            artifacts/eve-sdk-*.zip
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Upload to GitHub Release
        if: inputs.publish != false
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$TAG"
          shopt -s nullglob
          zips=(artifacts/eve-sdk-*.zip)
          zips+=(artifacts/SHA256SUMS)
          gh release upload "$TAG" "${zips[@]}" --repo "$REPO" --clobber
          echo "Attached SDKs to $TAG:"
          printf '  %s\n' "${zips[@]}"

  # ---- Consumer simulation -----------------------------------------------
  # Play the role of an end user whose machine has NOTHING but the packaged
  # SDK zip: download the real release artifact -> eve get android ->
  # eve build android (APK) -> eve package <host> -> run the packaged game.
  # Cross-packaging (linux -> win32, macosx -> win32/linux) is exercised by
  # setting EVE_CROSS_TARGETS; combos that cannot cross-compile are simply not
  # listed (see run-*-cross jobs for the combos we promise).
  consumer-arm64:
    name: Native ARM64 released SDK consumer (${{ matrix.platform }})
    needs: publish
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32
            runner: windows-11-arm
          - platform: linux
            runner: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ALSOFT_DRIVERS: "null"
    steps:
      - name: Checkout consumer checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.tag }}
      - name: Download candidate SDK set (PR preview)
        if: inputs.publish == false
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sdk-set
          path: candidate-sdk-set
      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::Retries=2
          sudo apt-get install -y --no-install-recommends cmake build-essential \
            mesa-vulkan-drivers libvulkan1 xvfb xauth libasound2t64 libx11-6 \
            libxi6 libxcursor1 libxrandr2 libxinerama1 libxss1 libgl1
      - name: Setup native software Vulkan
        timeout-minutes: 90
        uses: ./.github/actions/setup-arm64-vulkan
      - name: Download released SDK and checksums
        if: inputs.publish != false
        env:
          PLATFORM: ${{ matrix.platform }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p artifacts
          gh release download "$TAG" --repo "$REPO" --dir artifacts \
            --pattern "eve-sdk-$PLATFORM-arm64-$TAG.zip" --pattern SHA256SUMS
          (cd artifacts && grep "eve-sdk-$PLATFORM-arm64-$TAG.zip$" SHA256SUMS | sha256sum --check --strict)
      - name: Verify candidate ARM64 SDK checksums
        if: inputs.publish == false
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p artifacts
          cp "candidate-sdk-set/eve-sdk-$PLATFORM-arm64-$TAG.zip" candidate-sdk-set/SHA256SUMS artifacts/
          (cd artifacts && grep "eve-sdk-$PLATFORM-arm64-$TAG.zip$" SHA256SUMS | sha256sum --check --strict)
      - name: Build consumer plugin and run packaged game from released SDK
        timeout-minutes: 15
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          command=(bash .github/scripts/test-arm64-sdk.sh "artifacts/eve-sdk-$PLATFORM-arm64-$TAG.zip" "$PLATFORM" "${TAG#v}")
          if [ "$PLATFORM" = linux ]; then xvfb-run -a "${command[@]}"; else "${command[@]}"; fi

  consumer-win32:
    name: Consumer win32 (get android + build + run)
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag }}
      HOST: win32
      EVE_CROSS_TARGETS: ""
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.tag }}

      - name: Download candidate SDK set (PR preview)
        if: inputs.publish == false
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sdk-set
          path: candidate-sdk-set
      - name: Use candidate SDK mirror for consumer downloads
        if: inputs.publish == false
        shell: bash
        run: |
          base="$(python3 -c 'from pathlib import Path; print(Path("candidate-sdk-set").resolve().as_uri())')"
          echo "EVE_SDK_DOWNLOAD_BASE=$base" >> "$GITHUB_ENV"
          echo "EVE_SDK_BASE_URL=$base" >> "$GITHUB_ENV"
          echo "EVE_SDK_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Install Vulkan SDK (SwiftShader for the packaged-game run)
        timeout-minutes: 20
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1
        with:
          vulkan_version: ${{ env.VULKAN_VERSION }}
          install_runtime: true
          install_swiftshader: true
          cache: true
          cache_save_if: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup software Vulkan ICD (SwiftShader)
        timeout-minutes: 5
        run: bash .github/scripts/setup-software-vulkan.sh

      - name: Cache Android toolchain (JDK/Gradle/cmdline-tools/platform)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.eve-ci/android-sdk
          key: eve-android-toolchain-${{ runner.os }}-v1

      - name: Cache Gradle dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches
          key: eve-gradle-${{ runner.os }}-v1

      - name: Resolve toolchain dirs (cacheable, absolute)
        run: |
          echo "EVE_SDK_INSTALL_ROOT=$HOME/.eve-ci/eve-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$HOME/.eve-ci/android-sdk" >> "$GITHUB_ENV"

      - name: Run consumer test (get android -> build android -> package -> run)
        timeout-minutes: 60
        run: bash .github/scripts/consumer-test.sh "$HOST" "$TAG" "$RUNNER_TEMP/consumer"

      - name: Upload android APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-apk-${{ env.HOST }}
          path: ${{ runner.temp }}/consumer/eve-android-${{ env.HOST }}.apk
          if-no-files-found: error
          retention-days: 7

  consumer-linux:
    name: Consumer linux (get android + build + run + cross win32)
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TAG: ${{ inputs.tag }}
      HOST: linux
      EVE_CROSS_TARGETS: win32
      # Headless runners have no sound card; OpenAL's ALSA backend fails and
      # the Audio module would be left uninitialized. Use the null backend
      # (same pattern as the unit tests in AGENTS.md) so the packaged game
      # exercises the full startup path.
      # Quoted: an unquoted YAML null would set an EMPTY variable, which
      # OpenAL treats as "no driver override" (ALSA still gets tried).
      ALSOFT_DRIVERS: "null"
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.tag }}

      - name: Download candidate SDK set (PR preview)
        if: inputs.publish == false
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sdk-set
          path: candidate-sdk-set
      - name: Use candidate SDK mirror for consumer downloads
        if: inputs.publish == false
        shell: bash
        run: |
          base="$(python3 -c 'from pathlib import Path; print(Path("candidate-sdk-set").resolve().as_uri())')"
          echo "EVE_SDK_DOWNLOAD_BASE=$base" >> "$GITHUB_ENV"
          echo "EVE_SDK_BASE_URL=$base" >> "$GITHUB_ENV"
          echo "EVE_SDK_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Install headless runtime deps
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libx11-6 libxrandr2 libxi6 libxcursor1 libxss1 libxinerama1 \
            libxxf86vm1 libasound2t64 libgl1 \
            mesa-vulkan-drivers xvfb

      - name: Setup software Vulkan ICD (Lavapipe)
        timeout-minutes: 5
        run: bash .github/scripts/setup-software-vulkan.sh

      - name: Cache Android toolchain (JDK/Gradle/cmdline-tools/platform)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.eve-ci/android-sdk
          key: eve-android-toolchain-${{ runner.os }}-v1

      - name: Cache Gradle dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches
          key: eve-gradle-${{ runner.os }}-v1

      - name: Resolve toolchain dirs (cacheable, absolute)
        run: |
          echo "EVE_SDK_INSTALL_ROOT=$HOME/.eve-ci/eve-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$HOME/.eve-ci/android-sdk" >> "$GITHUB_ENV"

      - name: Run consumer test (get android -> build android -> package -> run + cross win32)
        timeout-minutes: 90
        run: |
          # Ubuntu ships the Lavapipe manifest as lvp_icd.json (no suffix);
          # a glob that requires a suffix leaves VK_ICD_FILENAMES empty and the
          # loader finds no ICD, so SDL_Vulkan_CreateSurface fails.
          export VK_ICD_FILENAMES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)"
          xvfb-run -a bash .github/scripts/consumer-test.sh "$HOST" "$TAG" "$RUNNER_TEMP/consumer"

      - name: Upload android APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-apk-${{ env.HOST }}
          path: ${{ runner.temp }}/consumer/eve-android-${{ env.HOST }}.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload cross win32 package (produced on linux)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-win32-from-linux
          path: ${{ runner.temp }}/consumer/pkg-win32.tar.gz
          if-no-files-found: error
          retention-days: 7

  consumer-macosx:
    name: Consumer macosx ${{ matrix.architecture }} (get + build + package + run)
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-latest
          - architecture: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      TAG: ${{ inputs.tag }}
      HOST: macosx
      EVE_SDK_ARCHITECTURE: ${{ matrix.architecture }}
      EVE_CROSS_TARGETS: ${{ matrix.architecture == 'arm64' && 'win32 linux' || '' }}
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.tag }}

      - name: Download candidate SDK set (PR preview)
        if: inputs.publish == false
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sdk-set
          path: candidate-sdk-set
      - name: Use candidate SDK mirror for consumer downloads
        if: inputs.publish == false
        shell: bash
        run: |
          base="$(python3 -c 'from pathlib import Path; print(Path("candidate-sdk-set").resolve().as_uri())')"
          echo "EVE_SDK_DOWNLOAD_BASE=$base" >> "$GITHUB_ENV"
          echo "EVE_SDK_BASE_URL=$base" >> "$GITHUB_ENV"
          echo "EVE_SDK_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Cache Android toolchain (JDK/Gradle/cmdline-tools/platform)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.eve-ci/android-sdk
          key: eve-android-toolchain-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Cache Gradle dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches
          key: eve-gradle-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Resolve toolchain dirs (cacheable, absolute)
        run: |
          echo "EVE_SDK_INSTALL_ROOT=$HOME/.eve-ci/eve-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$HOME/.eve-ci/android-sdk" >> "$GITHUB_ENV"

      - name: Run consumer test (get android -> build android -> package -> run + cross win32/linux)
        timeout-minutes: 90
        run: bash .github/scripts/consumer-test.sh "$HOST" "$TAG" "$RUNNER_TEMP/consumer"

      - name: Upload android APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-apk-${{ env.HOST }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/consumer/eve-android-${{ env.HOST }}-${{ matrix.architecture }}.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload cross win32 package (produced on macosx)
        if: ${{ matrix.architecture == 'arm64' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-win32-from-macosx
          path: ${{ runner.temp }}/consumer/pkg-win32.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload cross linux package (produced on macosx)
        if: ${{ matrix.architecture == 'arm64' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-linux-from-macosx
          path: ${{ runner.temp }}/consumer/pkg-linux.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ---- Packaged-game run verification on the target platform ---------------
  # A package produced by a foreign host must actually run on its target.
  run-win32-cross:
    name: Verify win32 packages from linux/macosx inputs
    needs: [consumer-linux, consumer-macosx]
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.tag }}

      - name: Install Vulkan SDK (SwiftShader for the packaged-game run)
        timeout-minutes: 20
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1
        with:
          vulkan_version: ${{ env.VULKAN_VERSION }}
          install_runtime: true
          install_swiftshader: true
          cache: true
          cache_save_if: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup software Vulkan ICD (SwiftShader)
        timeout-minutes: 5
        run: bash .github/scripts/setup-software-vulkan.sh

      - name: Download cross win32 packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pkg-win32-from-*
          path: packages

      - name: Run each win32 package and require the startup marker
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # Git Bash passes RUNNER_TEMP in Windows form (D:\a\_temp); normalize
          # before mkdir/tar (see consumer-test.sh for the same fix).
          case "$(uname -s)" in
            MINGW*|MSYS*|CYGWIN*)
              RUNNER_TEMP="$(cygpath -u "$RUNNER_TEMP")"
              ;;
          esac
          found=0
          for tgz in packages/*/pkg-win32.tar.gz; do
            [ -f "$tgz" ] || continue
            name="$(basename "$(dirname "$tgz")")"
            dir="$RUNNER_TEMP/run-$name"
            mkdir -p "$dir"
            tar -xzf "$tgz" -C "$dir"
            bash .github/scripts/prepare-cross-consumer.sh win32 "$dir"
            log="$RUNNER_TEMP/run-${name}.log"
            ( cd "$dir/verified" && exec ./eve.exe >"$log" 2>&1 ) &
            pid=$!
            ok=0
            for i in $(seq 1 40); do
              grep -q EVE_CI_GAME_OK "$log" 2>/dev/null && { ok=1; break; }
              sleep 1
            done
            kill "$pid" 2>/dev/null || true
            if [ "$ok" -eq 1 ]; then
              echo "OK: $name printed EVE_CI_GAME_OK"
              found=$((found + 1))
            else
              echo "FAIL: $name did not start (log tail):"
              tail -n 20 "$log" 2>/dev/null || true
              exit 1
            fi
          done
          [ "$found" -eq 2 ] || { echo "ERROR: both linux and macosx win32 transfers must pass" >&2; exit 1; }

  run-linux-cross:
    name: Verify linux package from macosx inputs
    needs: consumer-macosx
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.tag }}

      - name: Install headless runtime deps
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libx11-6 libxrandr2 libxi6 libxcursor1 libxss1 libxinerama1 \
            libxxf86vm1 libasound2t64 libgl1 \
            mesa-vulkan-drivers xvfb

      - name: Setup software Vulkan ICD (Lavapipe)
        timeout-minutes: 5
        run: bash .github/scripts/setup-software-vulkan.sh

      - name: Download cross linux package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pkg-linux-from-macosx
          path: packages

      - name: Run the linux package and require the startup marker
        timeout-minutes: 20
        run: |
          set -euo pipefail
          tar -xzf packages/pkg-linux.tar.gz -C packages
          # Ubuntu names the Lavapipe manifest lvp_icd.json (no suffix).
          export VK_ICD_FILENAMES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)"
          export ALSOFT_DRIVERS=null
          xvfb-run -a bash .github/scripts/prepare-cross-consumer.sh linux packages
          xvfb-run -a bash -c 'cd packages/verified && exec ./eve > ../run.log 2>&1' &
          pid=$!
          ok=0
          for i in $(seq 1 40); do
            grep -q EVE_CI_GAME_OK packages/run.log 2>/dev/null && { ok=1; break; }
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          if [ "$ok" -eq 1 ]; then
            echo "OK: linux package (built on macosx) printed EVE_CI_GAME_OK"
          else
            tail -n 25 packages/run.log 2>/dev/null || true
            echo "ERROR: linux package did not print EVE_CI_GAME_OK" >&2
            exit 1
          fi

  # ---- Android emulator run (release hard gate) ------------------------------
  # Every desktop consumer builds an ARM64-only APK from the official Android
  # SDK. API 35's x86_64 image can execute those APKs through ARM translation,
  # while GitHub's Linux runner supplies KVM for a reliable emulator boot.
  run-android:
    name: Run all ARM64 consumer APKs on API 35 emulator
    needs: [consumer-win32, consumer-linux, consumer-macosx]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          ref: ${{ inputs.ref }}

      - name: Download all consumer Android APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: android-apk-*
          path: apk
          merge-multiple: true

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot API 35 emulator, install and launch every ARM64 APK
        timeout-minutes: 115
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 1800
          emulator-options: >-
            -no-window
            -gpu swiftshader
            -no-snapshot
            -partition-size 8192
            -wipe-data
            -noaudio
            -no-boot-anim
            -accel on
          disable-linux-hw-accel: false
          disable-animations: true
          script: bash .github/scripts/run-consumer-apks.sh apk 4

  # ---- iOS: engine runs a game on the simulator (release hard gate) ----------
  # The released ios SDK is a device app; the simulator cannot execute device
  # slices, so this builds the game app for iphonesimulator from the release
  # source and boots it. A failure blocks formal release promotion.
  ios-sim:
    name: iOS simulator run
    needs: publish
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.tag }}
          submodules: recursive

      - name: Install tools
        timeout-minutes: 10
        run: brew install ninja || true

      - name: Install Vulkan SDK (MoltenVK for the simulator build)
        timeout-minutes: 20
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1
        with:
          vulkan_version: ${{ env.VULKAN_VERSION }}
          cache: true
          cache_save_if: false
          destination: ${{ runner.temp }}/VulkanSDK
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve VULKAN_SDK
        timeout-minutes: 5
        run: bash .github/scripts/resolve-vulkan-macos.sh "${{ runner.temp }}/VulkanSDK"

      - name: Create the CI game (startup marker in main.nut)
        run: |
          mkdir -p "$RUNNER_TEMP/ci-game"
          cat > "$RUNNER_TEMP/ci-game/config.nut" <<'EOF'
          config = { width=0 height=0 title="eve-ci" debug=false hotReload=false };
          EOF
          cat > "$RUNNER_TEMP/ci-game/main.nut" <<'EOF'
          eve_init = function() { print("EVE_CI_GAME_OK"); };
          eve_update = function(dt) {};
          EOF

      - name: Build iOS game app for the simulator
        timeout-minutes: 80
        run: make build/ios-sim-debug IOS_GAME="$RUNNER_TEMP/ci-game" JOBS="$(sysctl -n hw.ncpu)"

      - name: Boot simulator, install, launch, look for the startup marker
        timeout-minutes: 20
        run: |
          set -euo pipefail
          APP="$(find build/ios-sim-debug -name 'eve.app' -type d | head -1)"
          [ -n "$APP" ] || { echo "WARN: eve.app not found"; exit 1; }
          SIM="$(xcrun simctl list devices available | sed -n 's/.*(\([0-9A-Fa-f-]\{36\}\)).*/\1/p' | head -1)"
          [ -n "$SIM" ] || { echo "WARN: no simulator available"; exit 1; }
          xcrun simctl boot "$SIM" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM" -b >/dev/null 2>&1 || true
          xcrun simctl install "$SIM" "$APP"
          xcrun simctl launch "$SIM" com.evengine.example
          ok=0
          for i in $(seq 1 90); do
            if xcrun simctl spawn "$SIM" log show --last 2s --predicate 'eventMessage CONTAINS "EVE_CI_GAME_OK"' 2>/dev/null \
               | grep -q EVE_CI_GAME_OK; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" -eq 1 ]; then
            echo "OK: iOS game printed EVE_CI_GAME_OK on the simulator"
          else
            echo "WARN: iOS game marker not seen on the simulator"
            xcrun simctl spawn "$SIM" log show --last 60s --predicate 'process == "eve"' 2>/dev/null | tail -n 40 || true
            exit 1
          fi

  consumer-webgpu:
    name: Downloaded WebGPU SDK browser consumer
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.tag }}
      - name: Download candidate SDK set
        if: inputs.publish == false
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sdk-set
          path: artifacts
      - name: Download released WebGPU SDK
        if: inputs.publish != false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p artifacts
          gh release download "$TAG" --repo "$REPO" --dir artifacts \
            --pattern "eve-sdk-webgpu-$TAG.zip" --pattern SHA256SUMS
      - name: Setup pinned WebGPU browser
        timeout-minutes: 10
        uses: ./.github/actions/setup-webgpu-browser

      - name: Verify checksum and run extracted SDK
        env:
          TAG: ${{ inputs.tag }}
        run: |
          (cd artifacts && grep "eve-sdk-webgpu-$TAG.zip$" SHA256SUMS | sha256sum --check --strict)
          python3 scripts/test_webgpu_sdk.py "artifacts/eve-sdk-webgpu-$TAG.zip" \
            --version "${TAG#v}" --output artifacts/webgpu-consumer
      - name: Upload WebGPU consumer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webgpu-consumer-evidence
          path: artifacts/webgpu-consumer/
          if-no-files-found: warn

  release-ready:
    name: Nine SDKs and all consumer gates passed
    if: always()
    needs: [publish, consumer-arm64, consumer-win32, consumer-linux, consumer-macosx, consumer-webgpu, run-win32-cross, run-linux-cross, run-android, ios-sim]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate to succeed (skips fail closed)
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          failed = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          if failed:
              raise SystemExit(f"Release gates did not pass: {failed}")
          print("All nine SDKs and consumer runtime gates passed")
          PY
