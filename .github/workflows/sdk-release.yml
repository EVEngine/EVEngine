# Build target-platform SDKs and attach eve-sdk-<plat>-<tag>.zip to a Release.
# Formal promote (unmark prerelease) is scripts/release.py finish, not this file.
# Each SDK runs as its own parallel job (same split as ci.yml):
#   windows → win32 SDK (+ usability test)
#   android → android SDK
#   macos   → macosx SDK (+ usability test)
#   ios     → ios SDK
#   linux   → linux SDK (+ usability test)
#
# Called from release.yml after strict tests, or via workflow_dispatch + tag.
#
# iOS signing (optional repo secrets):
#   IOS_CERTIFICATE_P12_BASE64, IOS_CERTIFICATE_PASSWORD, IOS_DEVELOPMENT_TEAM
#   IOS_PROVISIONING_PROFILE_BASE64 (optional)
# Without them, iOS SDK builds unsigned (consumers re-sign locally).

name: SDK Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      ref:
        description: commit/branch to build (official vX.X.X after start)
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload SDKs for
        required: true
        type: string

permissions:
  contents: write

env:
  CMAKE_EXTRA_ARGS: -DBUILD_TESTING=OFF
  # Single source of truth: repository variables (Settings -> Secrets and
  # variables -> Actions -> Variables), falling back to these defaults.
  VULKAN_VERSION: ${{ vars.VULKAN_VERSION || '1.4.304.1' }}
  ANDROID_NDK_VERSION: ${{ vars.ANDROID_NDK_VERSION || '26.1.10909125' }}
  ANDROID_API: ${{ vars.ANDROID_API || '34' }}

jobs:
  windows:
    name: Windows SDK
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || inputs.tag }}
          submodules: recursive

      - name: Install build tools
        shell: pwsh
        run: |
          choco install make ninja -y --no-progress
          # Prefer VS 2022 on GitHub-hosted runners (local Makefile default is VS 2026).
          echo "VS_GENERATOR=Visual Studio 17 2022" >> $env:GITHUB_ENV

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1
        with:
          vulkan_version: ${{ env.VULKAN_VERSION }}
          install_runtime: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup software Vulkan (SwiftShader, best-effort)
        run: |
          bash .github/scripts/setup-software-vulkan.sh || echo "WARN: software Vulkan unavailable; in-memory run skipped"

      - name: Build win32 SDK
        run: make sdk/win32 VS_GENERATOR="$VS_GENERATOR" CMAKE_EXTRA_ARGS="$CMAKE_EXTRA_ARGS" JOBS="${NUMBER_OF_PROCESSORS:-8}"

      - name: Test win32 SDK usability
        env:
          TAG: ${{ inputs.tag }}
        run: bash .github/scripts/test-sdk.sh dist/eve-sdk/win32 win32 "${TAG#v}"

      - name: Package SDK zip
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p artifacts
          python .github/scripts/zip-sdk.py win32 "$TAG"
          ls -lh artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-win32
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android SDK
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || inputs.tag }}
          submodules: recursive

      - name: Install build tools
        shell: pwsh
        run: choco install make ninja -y --no-progress

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_API }}
            build-tools;${{ env.ANDROID_API }}.0.0
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Resolve Android SDK / NDK paths
        run: bash .github/scripts/setup-android-sdk.sh

      - name: Write Gradle local.properties
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > platform/android/apk/local.properties
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK=$ANDROID_NDK"
          test -f "$ANDROID_NDK/build/cmake/android.toolchain.cmake"

      - name: Build android SDK
        run: |
          test -f "$ANDROID_NDK/build/cmake/android.toolchain.cmake"
          make sdk/android \
            ANDROID_SDK="$ANDROID_SDK" \
            ANDROID_NDK="$ANDROID_NDK" \
            JAVA_HOME="$JAVA_HOME" \
            CMAKE_EXTRA_ARGS="$CMAKE_EXTRA_ARGS" \
            ANDROID_JOBS="${NUMBER_OF_PROCESSORS:-8}"

      - name: Test android SDK usability (assemble APK)
        env:
          TAG: ${{ inputs.tag }}
        run: bash .github/scripts/test-sdk.sh dist/eve-sdk/android android "${TAG#v}"

      - name: Package SDK zip
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p artifacts
          python .github/scripts/zip-sdk.py android "$TAG"
          ls -lh artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-android
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS SDK
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || inputs.tag }}
          submodules: recursive

      - name: Install tools
        run: |
          brew install ninja || true
          # CMake on macos runners is usually recent enough; ensure ≥ 3.21.
          cmake --version

      - name: Install Vulkan SDK (MoltenVK)
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1
        with:
          vulkan_version: ${{ env.VULKAN_VERSION }}
          # Keep full macOS tree so MoltenVK remains available.
          cache: true
          destination: ${{ runner.temp }}/VulkanSDK
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve VULKAN_SDK / MoltenVK
        run: bash .github/scripts/resolve-vulkan-macos.sh "${{ runner.temp }}/VulkanSDK"

      - name: Build macosx SDK
        run: make sdk/macosx CMAKE_EXTRA_ARGS="$CMAKE_EXTRA_ARGS" JOBS="$(sysctl -n hw.ncpu)"

      - name: Test macosx SDK usability
        env:
          TAG: ${{ inputs.tag }}
        run: bash .github/scripts/test-sdk.sh dist/eve-sdk/macosx macosx "${TAG#v}"

      - name: Package SDK zip
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p artifacts
          python3 .github/scripts/zip-sdk.py macosx "$TAG"
          ls -lh artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-macosx
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS SDK
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || inputs.tag }}
          submodules: recursive

      - name: Install tools
        run: |
          brew install ninja || true
          cmake --version

      - name: Install Vulkan SDK (MoltenVK + iOS)
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1
        with:
          vulkan_version: ${{ env.VULKAN_VERSION }}
          # Keep full macOS tree so MoltenVK / iOS xcframework remain available.
          cache: true
          destination: ${{ runner.temp }}/VulkanSDK
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve VULKAN_SDK / MoltenVK for iOS
        run: bash .github/scripts/resolve-vulkan-macos.sh "${{ runner.temp }}/VulkanSDK"

      - name: Setup iOS signing (optional)
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: bash .github/scripts/setup-ios-signing.sh

      - name: Build ios SDK
        run: |
          set -euo pipefail
          JOBS="$(sysctl -n hw.ncpu)"
          if [ "${IOS_SIGNING:-0}" = "1" ] && [ -n "${IOS_DEVELOPMENT_TEAM:-}" ]; then
            echo "Building signed iOS SDK (team=$IOS_DEVELOPMENT_TEAM)"
            make sdk/ios \
              IOS_DEVELOPMENT_TEAM="$IOS_DEVELOPMENT_TEAM" \
              CMAKE_EXTRA_ARGS="$CMAKE_EXTRA_ARGS" \
              ANDROID_JOBS="$JOBS"
          else
            echo "Building unsigned iOS SDK (consumers re-sign locally)"
            make sdk/ios \
              IOS_DEVELOPMENT_TEAM= \
              CMAKE_EXTRA_ARGS="$CMAKE_EXTRA_ARGS" \
              ANDROID_JOBS="$JOBS"
          fi

      - name: Package SDK zip
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p artifacts
          python3 .github/scripts/zip-sdk.py ios "$TAG"
          ls -lh artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-ios
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || inputs.tag }}
          submodules: recursive

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build zip \
            libx11-dev libxxf86vm-dev libxi-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev libxext-dev libxss-dev \
            libgl1-mesa-dev \
            libbz2-dev libpng-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev \
            mesa-vulkan-drivers vulkan-tools \
            xvfb

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1
        with:
          vulkan_version: ${{ env.VULKAN_VERSION }}
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup software Vulkan ICD (Lavapipe, best-effort)
        run: |
          bash .github/scripts/setup-software-vulkan.sh || echo "WARN: software Vulkan unavailable; in-memory run skipped"

      - name: Build linux SDK
        run: make sdk/linux CMAKE_EXTRA_ARGS="$CMAKE_EXTRA_ARGS" JOBS="$(nproc)"

      - name: Test linux SDK usability
        env:
          TAG: ${{ inputs.tag }}
        run: bash .github/scripts/test-sdk.sh dist/eve-sdk/linux linux "${TAG#v}"

      - name: Package SDK zip
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p artifacts
          python3 .github/scripts/zip-sdk.py linux "$TAG"
          ls -lh artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-linux
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach SDKs
    needs: [windows, android, macos, ios, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download all SDK artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sdk-*
          path: artifacts
          merge-multiple: true

      - name: List packages
        run: ls -lh artifacts/

      - name: Generate SHA256SUMS
        run: |
          python3 - <<'PYEOF'
          import hashlib
          import pathlib

          files = sorted(pathlib.Path("artifacts").glob("eve-sdk-*.zip"))
          if not files:
              raise SystemExit("no eve-sdk-*.zip found under artifacts/")
          with open("artifacts/SHA256SUMS", "w", encoding="utf-8") as fh:
              for path in files:
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  fh.write(f"{digest}  {path.name}\n")
          print(open("artifacts/SHA256SUMS", encoding="utf-8").read())
          PYEOF

      - name: Attest build provenance (best-effort)
        # Requires the repository's artifact attestations setting; non-blocking
        # until the maintainer enables it. Attestations bind to the zips by
        # digest, so they survive the GitHub Release upload.
        continue-on-error: true
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: artifacts/eve-sdk-*.zip

      - name: Verify SDK versions match the release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          EXPECTED="${TAG#v}"
          test -n "$EXPECTED"
          python3 - "$EXPECTED" <<'PYEOF'
          import pathlib
          import sys
          import zipfile

          expected = sys.argv[1]
          zips = sorted(pathlib.Path("artifacts").glob("eve-sdk-*.zip"))
          if not zips:
              sys.exit("no eve-sdk-*.zip found under artifacts/")
          for zip_path in zips:
              name = zip_path.name
              plat = name[len("eve-sdk-"):name.rfind("-")]
              entry = f"eve-sdk/{plat}/share/eve/VERSION"
              with zipfile.ZipFile(zip_path) as zf:
                  got = zf.read(entry).decode("utf-8").strip()
              if got != expected:
                  sys.exit(f"VERSION mismatch in {name}: '{got}' != expected '{expected}'")
              print(f"OK: {name} VERSION={got}")
          PYEOF

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$TAG"
          shopt -s nullglob
          zips=(artifacts/eve-sdk-*.zip)
          if [ ${#zips[@]} -lt 5 ]; then
            echo "Expected 5 SDK zips (win32/android/macosx/ios/linux), found ${#zips[@]}:" 
            printf '  %s\n' "${zips[@]}"
            exit 1
          fi
          zips+=(artifacts/SHA256SUMS)
          gh release upload "$TAG" "${zips[@]}" --repo "$REPO" --clobber
          echo "Attached SDKs to $TAG:"
          printf '  %s\n' "${zips[@]}"
