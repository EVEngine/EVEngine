<!--
  EVEngine static-docs header.

  Unlike the doxygen-awesome sidebar (which builds the tree with JavaScript),
  this layout ships a plain-HTML sidebar rendered by the docs/CMakeLists.txt
  generator. It works with or without JavaScript and at any window width.

  replaced with the generated navigation (do NOT repeat that placeholder text
  in other comments).

<html xmlns="http://www.w3.org/1999/xhtml">

<meta http-equiv="X-UA-Compatible" content="IE=11"/>
<meta name="generator" content="Doxygen $doxygenversion"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<script type="text/javascript" src="$relpath^jquery.js"></script>
<script type="text/javascript" src="$relpath^dynsections.js"></script>
$search
$mathjax
<link href="$relpath^$stylesheet" rel="stylesheet" type="text/css" />
$extrastylesheet

</script>
